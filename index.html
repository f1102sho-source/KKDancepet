  };

  window.__renderStarted = false;

  function __markLoaded(name) {
    window.__libStatus[name] = true;
  }
  function __markFailed(name) {
    window.__libFailed.push(name);
  }
  function __showBootMessage(force) {
    var el = document.getElementById("boot-msg");
    if (!el) return; // すでに本編が表示できている
    if (window.__renderStarted && !force) return; // アプリの描画が始まっていれば何もしない

    if (window.__libFailed.length > 0) {
      el.textContent =
        "読み込みに失敗しました。\n\n" +
        "・失敗した項目: " + window.__libFailed.join("、") + "\n" +
        "・電波/Wi-Fiが安定しているか確認して、もう一度この画面を開き直してください\n" +
        "・それでも変わらない場合は、この画面のスクリーンショットを送ってください";
      return;
    }
    var notYet = Object.keys(window.__libStatus).filter(function (k) { return !window.__libStatus[k]; });
    if (notYet.length > 0) {
      el.textContent =
        "読み込みに時間がかかっています。\n\n" +
        "・まだ準備できていない項目: " + notYet.join("、") + "\n" +
        "・電波/Wi-Fiが安定しているか確認してください\n" +
        "・そのまましばらく待っても表示されない場合は、この画面のスクリーンショットを送ってください";
    } else {
      // 全部読み込めているのにまだ描画されていない → アプリ内部の処理が重い/固まっている
      el.textContent =
        "読み込みは完了していますが、表示の準備に時間がかかっています。\n\n" +
        "・そのまま10〜20秒ほどお待ちください\n" +
        "・変わらない場合は、この画面のスクリーンショットを送ってください";
    }
  }

  // 最初の目安（8秒）でまだなら状況を表示。ここでは「失敗」とは断定しない
  window.__bootTimeoutSoft = setTimeout(function () { __showBootMessage(false); }, 8000);
  // 25秒たっても描画が始まらなければ、はっきり止まっていると判断して強制表示
  window.__bootTimeoutHard = setTimeout(function () { __showBootMessage(true); }, 25000);

  window.addEventListener(
    "error",
    function (e) {
      var el = document.getElementById("boot-msg");
      if (window.__renderStarted && (!el)) return; // 本編表示後の無害なエラーは無視
      if (el) {
        var detail = (e && e.message) ? e.message : (e && e.error) ? String(e.error) : "不明なエラー";
        el.textContent = "エラーがおきました:\n" + detail;
      }
    },
    true // キャプチャ段階で拾うことで、<script>の読み込み失敗も検知できるようにする
  );
</script>

/* このファイルを外部ホスティングで開いたとき用の window.storage 代替。
   同期コードが設定されていてFirebaseが使える場合はクラウド(Firestore)に、
   それ以外はこれまで通りこの端末だけのlocalStorageに保存する。
   （Claudeのアーティファクト内であれば元々の window.storage をそのまま使う） */
if (!window.storage) {
  window.storage = {
    async get(key) {
      const code = getSyncCode();
      if (firestoreDb && code) {
        const doc = await firestoreDb.collection("dancePetSync").doc(code).get();
        if (!doc.exists || !(key in (doc.data() || {}))) throw new Error("not found");
        return { key, value: doc.data()[key] };
      }
      const v = localStorage.getItem(key);
      if (v === null) throw new Error("not found");
      return { key, value: v };
    },
    async set(key, value) {
      const code = getSyncCode();
      if (firestoreDb && code) {
        await firestoreDb
          .collection("dancePetSync")
          .doc(code)
          .set({ [key]: value, _updatedAt: Date.now() }, { merge: true });
        return { key, value };
      }
      localStorage.setItem(key, value);
      return { key, value };
    },
    async delete(key) {
      const code = getSyncCode();
      if (firestoreDb && code) {
        await firestoreDb
          .collection("dancePetSync")
          .doc(code)
          .set({ [key]: firebase.firestore.FieldValue.delete() }, { merge: true });
        return { key, deleted: true };
      }
      localStorage.removeItem(key);
      return { key, deleted: true };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix };
    },
  };
}

function todayStr(offset = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offset);

}

function daysBetween(a, b) {
  return Math.round((new Date(a) - new Date(b)) / 86400000);
}

/* げんき度：最後に練習した日からの経過日数で決まる（保存しておく必要はない） */
function calcHealth(lastDate) {
  if (!lastDate) return 75;
  const diff = daysBetween(todayStr(), lastDate);
  if (diff <= 1) return 100;
  return Math.max(0, 100 - (diff - 1) * 22);
}

/* ============ 動画のモーション解析（簡易プロトタイプ版） ============ */
function seekTo(video, t, timeoutMs = 2500) {
  return new Promise((resolve) => {
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      video.removeEventListener("seeked", handler);
      resolve();
    };
    const handler = () => finish();
    video.addEventListener("seeked", handler);
    try {
      video.currentTime = t;
    } catch {
      finish();
      return;
    }
    setTimeout(finish, timeoutMs); // seekedが来ない場合でも先に進める
  });
}

/* Chromeなどでは MediaRecorder のブロブ動画の duration が Infinity になることがあり、
   そのままだとシークができない。大きな値へ一度シークして長さを確定させる対処。 */
function fixDuration(video) {
  return new Promise((resolve) => {
    if (video.duration && isFinite(video.duration) && video.duration > 0) {
      resolve();
      return;
    }
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      video.removeEventListener("timeupdate", onTimeUpdate);
      video.currentTime = 0;
      resolve();
    };
    const onTimeUpdate = () => finish();
    video.addEventListener("timeupdate", onTimeUpdate);
    try {
      video.currentTime = 1e7;
    } catch {
      finish();
      return;
    }
    setTimeout(finish, 2500);
  });
}

/* 既に読み込み済みの<video>要素からモーション曲線を取り出す。
   （新しくvideo要素を作って同じ動画を読み込み直すと、端末によって
   「対応していない形式」として弾かれることがあるため、それを避ける）
   あわせて「動きが始まったタイミング」も推定する（曲線の中で最初に
   一定以上のエネルギーになったサンプル位置＝動き出しとみなす）。 */
async function extractMotionCurveFromElement(video, samples = 24) {
  await fixDuration(video);
  let duration = video.duration;
  if (!duration || !isFinite(duration) || duration <= 0) duration = 3;
  const canvas = document.createElement("canvas");
  canvas.width = 48;
  canvas.height = 48;
  const ctx = canvas.getContext("2d");
  let prev = null;
  const energies = [];
  const sampleTimes = [];
  const originalTime = video.currentTime;
  for (let i = 0; i < samples; i++) {
    const t = (duration * i) / Math.max(samples - 1, 1);
    await seekTo(video, Math.min(t, Math.max(duration - 0.05, 0)));
    ctx.drawImage(video, 0, 0, 48, 48);
    const frame = ctx.getImageData(0, 0, 48, 48).data;
    if (prev) {
      let diff = 0;
      for (let p = 0; p < frame.length; p += 4) {
        diff +=
          Math.abs(frame[p] - prev[p]) +
          Math.abs(frame[p + 1] - prev[p + 1]) +
          Math.abs(frame[p + 2] - prev[p + 2]);
      }
      energies.push(diff);
      sampleTimes.push(t);
    }
    prev = frame;
  }
  try {
    video.currentTime = originalTime || 0;
  } catch {
    /* noop */
  }
  const max = Math.max(...energies, 1);
  const curve = energies.map((e) => e / max);

  // 動き出しタイミングの推定：
  // 「じっとしている状態(冒頭の平均エネルギー)」を基準にして、そこから
  // どれだけ動きが増えたかで判定する（固定のしきい値だと、動画ごとの
  // 明るさや揺れの差で始まりの位置がずれてしまうため）。
  const baselineCount = Math.max(2, Math.round(curve.length * 0.15));
  const baseline = curve.slice(0, baselineCount).reduce((a, b) => a + b, 0) / baselineCount;
  const threshold = baseline + (1 - baseline) * 0.22;
  let startIdx = curve.findIndex((v) => v >= threshold);
  if (startIdx === -1) startIdx = 0;
  const startTime = sampleTimes[startIdx] ?? 0;

  return { curve, startTime, duration };
}

function compareSelf(before, after) {
  const sum = (arr) => arr.reduce((a, b) => a + b, 0);
  const b = sum(before) || 0.001;
  const a = sum(after);
  const improvement = (a - b) / b;
  return Math.max(0, Math.min(100, Math.round(50 + improvement * 90)));
}

function compareToTeacher(mine, teacher) {
  const len = Math.min(mine.length, teacher.length);
  let dot = 0,
    magA = 0,
    magB = 0;
  for (let i = 0; i < len; i++) {
    dot += mine[i] * teacher[i];
    magA += mine[i] * mine[i];
    magB += teacher[i] * teacher[i];
  }
  const denom = Math.sqrt(magA) * Math.sqrt(magB) || 0.001;
  const sim = Math.max(0, Math.min(1, dot / denom));
  return Math.round(sim * 100);
}

/* ============ イラスト：トイプードル & マンチカン ============ */
function fluffRing(cx, cy, r, count, bumpR, color) {
  return Array.from({ length: count }).map((_, i) => {
    const angle = (i / count) * Math.PI * 2;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle) * 0.88;
    return <circle key={i} cx={x} cy={y} r={bumpR} fill={color} />;
  });
}

function DraggableDeco({ item, pos, editable, onDragEnd }) {
  const elRef = useRef(null);

  const handlePointerDown = (e) => {
    if (!editable) return;
    e.preventDefault();
    const el = elRef.current;
    const roomEl = el.closest(".room-view");
    if (!roomEl) return;
    el.classList.add("dragging");
    const rect = roomEl.getBoundingClientRect();

    const move = (ev) => {
      const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
      let x = ((clientX - rect.left) / rect.width) * 100;
      let y = ((clientY - rect.top) / rect.height) * 100;
      x = Math.min(92, Math.max(4, x));
      y = Math.min(90, Math.max(6, y));
      el.style.left = `${x}%`;
      el.style.top = `${y}%`;
      el.dataset.x = x;
      el.dataset.y = y;
    };
    const up = () => {
      el.classList.remove("dragging");
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      const x = parseFloat(el.dataset.x ?? pos.x);
      const y = parseFloat(el.dataset.y ?? pos.y);
      onDragEnd(item.id, x, y);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  };

  return (
    <div
      ref={elRef}
      className={`deco-item ${editable ? "draggable" : ""}`}
      style={{ left: `${pos.x}%`, top: `${pos.y}%` }}
      onPointerDown={handlePointerDown}
    >
      {item.emoji}
    </div>
  );
}

/* ============ 反省ノート（音声吹き込み） ============ */
/* 簡易的な要約（サーバーに接続しないため、AIによる要約ではなく
   文の重複除去＋先頭数文の抜き出しによる簡易整理） */
function summarizeText(text, maxLen = 60) {
  const sentences = text
    .split(/(?<=[。！？])/)
    .map((s) => s.trim())
    .filter(Boolean);
  const dedup = [];
  for (const s of sentences) {
    if (dedup[dedup.length - 1] !== s) dedup.push(s);
  }
  let joined = dedup.join("");
  if (!joined) joined = text.trim();
  if (joined.length <= maxLen) return joined;
  let summary = dedup.slice(0, 2).join("");
  if (summary.length > maxLen) summary = summary.slice(0, maxLen) + "…";
  else if (dedup.length > 2) summary += "…";
  return summary;
}

function ReflectionRecorder({ onSaved, alreadyRecordedToday }) {
  const [supported, setSupported] = useState(true);
  const [listening, setListening] = useState(false);
  const [transcript, setTranscript] = useState("");
  const [saved, setSaved] = useState(false);
  const [elapsedSec, setElapsedSec] = useState(0);
  const recognitionRef = useRef(null);
  const finalTextRef = useRef("");
  const sessionFinalizedIdxRef = useRef(0);
  const shouldContinueRef = useRef(false);
  const maxTimerRef = useRef(null);
  const tickTimerRef = useRef(null);

  useEffect(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setSupported(false);
      return;
    }
    const rec = new SR();
    rec.lang = "ja-JP";
    // continuous=trueだと端末によってresultIndexの扱いが不安定で
    // 同じ内容が繰り返し積み上がることがあるため、あえて短いセッションを
    // 繋げていく方式にする（1セッション＝1つの発話のまとまり）。
    rec.continuous = false;
    rec.interimResults = true;
    rec.onresult = (e) => {
      let sessionInterim = "";
      for (let i = 0; i < e.results.length; i++) {
        const res = e.results[i];
        if (res.isFinal) {
          if (i >= sessionFinalizedIdxRef.current) {
            finalTextRef.current += res[0].transcript;
            sessionFinalizedIdxRef.current = i + 1;
          }
        } else {
          sessionInterim += res[0].transcript;
        }
      }
      setTranscript(finalTextRef.current + sessionInterim);
    };
    rec.onerror = (e) => {
      if (e.error === "no-speech" || e.error === "aborted") return; // 軽微なものは無視して継続
      shouldContinueRef.current = false;
      setListening(false);
    };
    rec.onend = () => {
      // 端末側が勝手に区切って止めてしまった場合は、続きから自動で再開する
      if (shouldContinueRef.current) {
        try {
          sessionFinalizedIdxRef.current = 0;
          rec.start();
          return;
        } catch {
          /* noop */
        }
      }
      setListening(false);
    };
    recognitionRef.current = rec;
    return () => {
      shouldContinueRef.current = false;
      try {
        rec.stop();
      } catch {
        /* noop */
      }
      if (maxTimerRef.current) clearTimeout(maxTimerRef.current);
      if (tickTimerRef.current) clearInterval(tickTimerRef.current);
    };
  }, []);

  const startListening = () => {
    setSaved(false);
    setTranscript("");
    finalTextRef.current = "";
    sessionFinalizedIdxRef.current = 0;
    setElapsedSec(0);
    shouldContinueRef.current = true;
    try {
      recognitionRef.current?.start();
      setListening(true);
    } catch {
      /* すでに開始している場合は無視 */
    }
    if (maxTimerRef.current) clearTimeout(maxTimerRef.current);
    maxTimerRef.current = setTimeout(() => stopListening(), 60000); // 最長1分
    if (tickTimerRef.current) clearInterval(tickTimerRef.current);
    tickTimerRef.current = setInterval(() => setElapsedSec((s) => s + 1), 1000);
  };

  const stopListening = () => {
    shouldContinueRef.current = false;
    try {
      recognitionRef.current?.stop();
    } catch {
      /* noop */
    }
    setListening(false);
    if (maxTimerRef.current) {
      clearTimeout(maxTimerRef.current);
      maxTimerRef.current = null;
    }
    if (tickTimerRef.current) {
      clearInterval(tickTimerRef.current);
      tickTimerRef.current = null;
    }
  };

  const handleSave = () => {
    if (!transcript.trim()) return;
    onSaved(transcript.trim());
    setSaved(true);
  };

  const remaining = Math.max(0, 60 - elapsedSec);

  return (
    <div className="reflection-card">
      <div className="cal-title">🎤 反省ノート{alreadyRecordedToday ? "（今日のポイントはきろくずみ・追加はOK ✓）" : "（+2pt）"}</div>
      {!supported && (
        <>
          <p className="cal-legend">この端末では音声にんしきが使えないので、キーボードで入力してね。</p>
          <textarea
            className="reflection-textarea"
            value={transcript}
            onChange={(e) => {
              setTranscript(e.target.value);
              setSaved(false);
            }}
            placeholder="きょうの反省を入力してね..."
          />
        </>
      )}
      {supported && (
        <>
          <button className={`mic-btn ${listening ? "listening" : ""}`} onClick={listening ? stopListening : startListening}>
            {listening ? `🔴 きろく中...（のこり${remaining}びょう／タップでとめる）` : "🎤 タップして話す"}
          </button>
          {transcript && (
            <textarea
              className="reflection-textarea"
              value={transcript}
              onChange={(e) => {
                setTranscript(e.target.value);
                setSaved(false);
              }}
            />
          )}
        </>
      )}
      {transcript.trim() && (
        <button className="primary-btn" onClick={handleSave} disabled={saved}>
          {saved ? "ほぞんしたよ ✓" : "この内容でほぞんする"}
        </button>
      )}
    </div>
  );
}

function BackupPanel({ getSnapshotJson, onRestore }) {

    setMode("export");

    try {

/* ============ カメラ撮影コンポーネント ============ */
function CameraRecorder({ label, mirrored, setMirrored, onCaptured }) {
  const videoRef = useRef(null);
  const previewVideoRef = useRef(null);
  const streamRef = useRef(null);
  const recorderRef = useRef(null);
  const chunksRef = useRef([]);
  const [recording, setRecording] = useState(false);
  const [camError, setCamError] = useState(null); // {title, detail}
  const [previewUrl, setPreviewUrl] = useState(null);
  const [confirming, setConfirming] = useState(false);
  const [confirmError, setConfirmError] = useState(null);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      if (!window.isSecureContext) {
        setCamError({
          title: "この画面はカメラを使えない設定だよ",
          detail: "アプリとして公開・保存してから開くとカメラが使えるようになるよ。今は下から動画をえらんでね。",
        });
        return;
      }
      if (!navigator.mediaDevices?.getUserMedia) {
        setCamError({
          title: "このブラウザはカメラに対応していないみたい",
          detail: "下から動画ファイルをえらんでね。",
        });
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 },
            aspectRatio: { ideal: 16 / 9 },
          },
          audio: false,
        });
        if (cancelled) {
          stream.getTracks().forEach((t) => t.stop());
          return;
        }
        streamRef.current = stream;
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          videoRef.current.play().catch(() => {});
        }
      } catch (e) {
        if (cancelled) return;
        if (e.name === "NotAllowedError" || e.name === "SecurityError") {
          setCamError({
            title: "カメラの使用が許可されていないよ",
            detail: "ブラウザの設定でこのアプリのカメラをオンにしてね。今は下から動画をえらべるよ。",
          });
        } else if (e.name === "NotFoundError") {
          setCamError({
            title: "カメラが見つからなかったよ",
            detail: "この端末にカメラがないか、他のアプリが使用中かも。下から動画をえらんでね。",
          });
        } else {
          setCamError({
            title: "カメラを使えなかったよ",
            detail: "今のこの画面（プレビュー）ではカメラがブロックされていることがあるよ。下から動画をえらんでね。",
          });
        }
      }
    })();
    return () => {
      cancelled = true;
      if (streamRef.current) streamRef.current.getTracks().forEach((t) => t.stop());
    };
  }, []);

  const [tooShortWarning, setTooShortWarning] = useState(false);

  const startRecording = () => {
    if (!streamRef.current) return;
    chunksRef.current = [];
    setTooShortWarning(false);
    // ブラウザが実際にサポートしている形式を優先的に選ぶ
    const preferredTypes = [
      "video/webm;codecs=vp8,opus",
      "video/webm;codecs=vp9,opus",
      "video/webm",
      "video/mp4",
    ];
    const supportedType = preferredTypes.find((t) => window.MediaRecorder?.isTypeSupported?.(t));
    const rec = supportedType ? new MediaRecorder(streamRef.current, { mimeType: supportedType }) : new MediaRecorder(streamRef.current);
    rec.ondataavailable = (e) => {
      if (e.data.size > 0) chunksRef.current.push(e.data);
    };
    rec.onstop = () => {
      // 実際に録画で使われた形式（rec.mimeType）をそのままラベルにする。
      // ここが実際の符号化形式とズレていると、再読み込み時に「対応していない形式」として弾かれることがある。
      const actualType = rec.mimeType || supportedType || "video/webm";
      const blob = new Blob(chunksRef.current, { type: actualType });
      if (blob.size < 8000) {
        // 短すぎる/データが空の録画は解析に失敗しやすいので、撮り直しを促す
        setTooShortWarning(true);
        return;
      }
      const url = URL.createObjectURL(blob);
      setPreviewUrl(url);
    };
    rec.start();
    recorderRef.current = rec;
    setRecording(true);
  };

  const stopRecording = () => {
    recorderRef.current?.stop();
    setRecording(false);
  };

  const handleFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    setPreviewUrl(url);
  };

  return (
    <div className="capture-wrap">
      <div className="step-label">{label}</div>
      <div className="video-frame">

/* ============ 週の合計・月の合計を計算 ============ */
function getWeekRange(baseDate) {
  const d = new Date(baseDate);
  const day = d.getDay(); // 0=日
  const diffToMonday = day === 0 ? -6 : 1 - day;
  const monday = new Date(d);
  monday.setDate(d.getDate() + diffToMonday);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  return { start: monday, end: sunday };
}
function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function sumMinutesInRange(masterLog, start, end) {
  let total = 0;
  const cur = new Date(start);
  while (cur <= end) {
    const day = masterLog[dateKey(cur)];
    if (day) total += (day.normalMinutes || 0) + (day.cameraMinutes || 0);
    cur.setDate(cur.getDate() + 1);
  }
  return Math.round(total);
}

/* ============ マスターカレンダー（全体の練習記録） ============ */
function MasterCalendar({ masterLog }) {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startWeekday = firstDay.getDay();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  const todayDate = now.getDate();
  const [selectedDate, setSelectedDate] = useState(null);

  const { start: weekStart, end: weekEnd } = getWeekRange(now);
  const weekTotal = sumMinutesInRange(masterLog, weekStart, weekEnd);
  const monthStart = new Date(year, month, 1);
  const monthEnd = new Date(year, month, daysInMonth);
  const monthTotal = sumMinutesInRange(masterLog, monthStart, monthEnd);
  const isTuesday = now.getDay() === 2;

  return (
    <div className="calendar-card">
      <div className="cal-title">
        📅 {year}年{month + 1}月のれんしゅうきろく
      </div>
      {isTuesday && (
        <div className="week-banner">📊 今週(月〜日)のれんしゅう時間：合計 {weekTotal}分</div>
      )}
      <div className="cal-grid cal-head">
        {["日", "月", "火", "水", "木", "金", "土"].map((w) => (
          <div key={w} className="cal-cell head">
            {w}
          </div>
        ))}
      </div>
      <div className="cal-grid">
        {cells.map((d, i) => {
          if (d === null) return <div key={i} className="cal-cell empty" />;
          const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
          const day = masterLog[dateStr];
          const minutes = day ? Math.round((day.normalMinutes || 0) + (day.cameraMinutes || 0)) : 0;
          const done = !!day && (minutes > 0 || (day.cameraSessions || 0) > 0);
          const isToday = d === todayDate;
          const hasEntries = day && day.entries && day.entries.length > 0;
          return (
            <button
              key={i}
              className={`cal-cell cal-cell-btn ${done ? "done" : ""} ${isToday ? "today" : ""} ${selectedDate === dateStr ? "selected" : ""}`}
              onClick={() => setSelectedDate(selectedDate === dateStr ? null : dateStr)}
            >
              <span className="cal-day-num">{d}</span>
              {done && <span className="cal-stamp">🐾</span>}
              {minutes > 0 && <span className="cal-minutes">{minutes}分</span>}
              {hasEntries && <span className="cal-note-dot">📝</span>}
            </button>
          );
        })}
      </div>
      <div className="cal-legend">🐾 = 練習した日　数字 = その日の合計時間　📝 = きろくあり（タップで確認）</div>
      <div className="month-total-badge">🗓️ 今月の合計れんしゅう時間：{monthTotal}分</div>
      {selectedDate &&
        (() => {
          const day = masterLog[selectedDate] || { normalMinutes: 0, cameraMinutes: 0, cameraSessions: 0, entries: [] };
          const minutes = Math.round((day.normalMinutes || 0) + (day.cameraMinutes || 0));
          return (
            <div className="cal-reflection-view">
              <div className="cal-reflection-date">{selectedDate}のきろく</div>
              <div className="cal-reflection-text">
                合計 {minutes}分（ノーマル練習 {Math.round(day.normalMinutes || 0)}分／カメラ練習 {day.cameraSessions || 0}回）
              </div>
              {(!day.entries || day.entries.length === 0) && <div className="cal-reflection-text">この日のメモ・反省ノートはまだないよ。</div>}
              {(day.entries || []).map((entry, idx) => (
                <div key={idx} className="cal-reflection-entry">
                  <div className="cal-reflection-text">
                    {entry.type === "note" ? "✏️ " : "🎤 "}
                    {entry.summary}
                  </div>
                  {entry.full !== entry.summary && (
                    <details className="cal-reflection-full">
                      <summary>ぜんぶ見る</summary>
                      <div className="cal-reflection-text">{entry.full}</div>
                    </details>
                  )}
                </div>
              ))}
            </div>
          );
        })()}
    </div>
  );
}

    setStreak(s.streak || 0);
  };

  const migrateFromV3 = async () => {
    try {
      const res = await window.storage.get(STORAGE_KEY_V3, false);
      if (!res?.value) return null;
      const old = JSON.parse(res.value);
      const animals = ["dog", "cat", "chick"];
      let wallet = 0;
      animals.forEach((k) => (wallet += old.roomPointsMap?.[k] || 0));
      const ml = {};
      animals.forEach((k) => {
        (old.practiceLogs?.[k] || []).forEach((date) => {
          if (!ml[date]) ml[date] = emptyDay();
          ml[date].cameraSessions += 1;
          ml[date].milestones = { m10: true, m30: true, m60: true };
        });
        const refl = old.reflectionsMap?.[k] || {};
        Object.keys(refl).forEach((date) => {
          if (!ml[date]) ml[date] = emptyDay();
          const arr = Array.isArray(refl[date]) ? refl[date] : [refl[date]];
          arr.forEach((e) => {
            const entry = typeof e === "string" ? { full: e, summary: e } : e;
            ml[date].entries.push({ type: "reflection", full: entry.full, summary: entry.summary, time: entry.time || date });
          });
        });
      });
      let lastDate = null;
      animals.forEach((k) => {
        if (old.lastDates?.[k] && (!lastDate || old.lastDates[k] > lastDate)) lastDate = old.lastDates[k];
      });
      let maxStreak = 0;
      animals.forEach((k) => {
        maxStreak = Math.max(maxStreak, old.streaks?.[k] || 0);
      });
      return {
        walletPoints: wallet,
        progress: old.progress || { dog: 0, cat: 0, chick: 0 },
        decorations: old.decorations || { dog: [], cat: [], chick: [] },
        petNames: old.petNames || { dog: null, cat: null, chick: null },
        dirtiness: { dog: 0, cat: 0, chick: 0 },
        lastDirtCheck: null,
        masterLog: ml,
        lastPracticeDate: lastDate,
        streak: maxStreak,
      };
    } catch {
      return null;
    }
  };

  const reloadAllData = useCallback(async () => {
    setLoaded(false);
    try {
      const res = await window.storage.get(STORAGE_KEY, false);
      if (res?.value) {
        applyLoadedData(JSON.parse(res.value));
      } else {
        const migrated = await migrateFromV3();
        if (migrated) {
          applyLoadedData(migrated);
          await window.storage.set(STORAGE_KEY, JSON.stringify(migrated), false);
        } else {
          applyLoadedData({});
        }
      }
    } catch {
      applyLoadedData({});
    } finally {
      setLoaded(true);
    }
  }, []);

  useEffect(() => {
    setSyncCode(getSyncCode());
    reloadAllData();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const persist = useCallback(
    async (next) => {
      try {
        await window.storage.set(
          STORAGE_KEY,
          JSON.stringify({
            walletPoints: next.walletPoints ?? walletPoints,
            progress: next.progress ?? progress,
            decorations: next.decorations ?? decorations,
            petNames: next.petNames ?? petNames,
            dirtiness: next.dirtiness ?? dirtiness,
            lastDirtCheck: next.lastDirtCheck ?? lastDirtCheck,
            masterLog: next.masterLog ?? masterLog,
            lastPracticeDate: next.lastPracticeDate ?? lastPracticeDate,
            streak: next.streak ?? streak,
          }),
          false
        );
      } catch {
        /* 保存に失敗しても遊べる */
      }
    },
    [walletPoints, progress, decorations, petNames, dirtiness, lastDirtCheck, masterLog, lastPracticeDate, streak]
  );

  const applySyncCode = async (code) => {
    setSyncCodeLocal(code);
    setSyncCode(code);
    setSyncStatus(firebaseReady ? "どうきちゅう..." : "（クラウド設定が未設定のため、この端末だけの保存のままです）");
    await reloadAllData();
    setSyncStatus(firebaseReady ? "どうき完了！このコードを他の端末にも入力してね" : null);
  };

  const getSnapshotJson = () =>
    JSON.stringify(
      { walletPoints, progress, decorations, petNames, dirtiness, lastDirtCheck, masterLog, lastPracticeDate, streak, _backupAt: new Date().toISOString() },
      null,
      0
    );

  const restoreFromSnapshot = (s) => {
    const next = {
      walletPoints: s.walletPoints || 0,
      progress: s.progress || { dog: 0, cat: 0, chick: 0 },
      decorations: s.decorations || { dog: [], cat: [], chick: [] },
      petNames: s.petNames || { dog: null, cat: null, chick: null },
      dirtiness: s.dirtiness || { dog: 0, cat: 0, chick: 0 },
      lastDirtCheck: s.lastDirtCheck || null,
      masterLog: s.masterLog || {},
      lastPracticeDate: s.lastPracticeDate || null,
      streak: s.streak || 0,
    };
    applyLoadedData(next);
    persist(next);
  };

  // 練習した日の記録・れんぞく記録を更新する共通処理
  const registerPracticeDay = (today) => {
    let newStreak = streak;
    if (lastPracticeDate !== today) {
      newStreak = lastPracticeDate === todayStr(-1) ? streak + 1 : 1;
    }
    setStreak(newStreak);
    setLastPracticeDate(today);
    return newStreak;
  };

  // げんき度が低いまま1日経つと、うんちが3部屋いっしょに1つずつ増える
  useEffect(() => {
    if (!loaded) return;
    const today = todayStr();
    if (lastDirtCheck === today) return;
    const h = calcHealth(lastPracticeDate);
    const newLastDirtCheck = today;
    if (h < 35) {
      const newDirtiness = {
        dog: Math.min(5, dirtiness.dog + 1),
        cat: Math.min(5, dirtiness.cat + 1),

      setDirtiness(newDirtiness);
      setLastDirtCheck(newLastDirtCheck);
      persist({ dirtiness: newDirtiness, lastDirtCheck: newLastDirtCheck });
    } else {
      setLastDirtCheck(newLastDirtCheck);
      persist({ lastDirtCheck: newLastDirtCheck });
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded]);

  const cleanRoom = (a) => {
    const CLEAN_COST = 2;
    if (dirtiness[a] <= 0 || walletPoints < CLEAN_COST) return;
    const newDirtiness = { ...dirtiness, [a]: 0 };
    const newWallet = walletPoints - CLEAN_COST;
    setDirtiness(newDirtiness);
    setWalletPoints(newWallet);
    persist({ dirtiness: newDirtiness, walletPoints: newWallet });
  };

  const buyItem = (itemId) => {
    const item = ROOM_ITEMS.find((i) => i.id === itemId);
    if (!item || !animal) return;
    const ownedIds = decorations[animal].map((d) => d.id);
    if (ownedIds.includes(itemId) || walletPoints < item.cost) return;
    const count = decorations[animal].length;
    const x = 15 + (count % 4) * 20;
    const y = 22 + Math.floor(count / 4) * 24;
    const newDecorations = { ...decorations, [animal]: [...decorations[animal], { id: itemId, x, y }] };
    const newWallet = walletPoints - item.cost;
    setDecorations(newDecorations);
    setWalletPoints(newWallet);
    persist({ decorations: newDecorations, walletPoints: newWallet });
  };

  const moveItem = (itemId, x, y) => {

    const newList = decorations[animal].map((d) => (d.id === itemId ? { ...d, x, y } : d));
    const newDecorations = { ...decorations, [animal]: newList };
    setDecorations(newDecorations);
    persist({ decorations: newDecorations });
  };

  const setPetName = (name) => {
    if (!animal) return;
    const newNames = { ...petNames, [animal]: name };
    setPetNames(newNames);
    persist({ petNames: newNames });
  };

  const [feedBurst, setFeedBurst] = useState(false);
  const feedPet = (a) => {

    const newProgress = { ...progress, [a]: progress[a] + 1 };
    const newWallet = walletPoints - 1;
    setProgress(newProgress);
    setWalletPoints(newWallet);
    persist({ progress: newProgress, walletPoints: newWallet });
    setFeedBurst(true);
    setTimeout(() => setFeedBurst(false), 1200);
  };

    setTimerSeconds(0);

    setScreen("normalTimer");
    if (timerIntervalRef.current) clearInterval(timerIntervalRef.current);
    timerIntervalRef.current = setInterval(() => setTimerSeconds((s) => s + 1), 1000);
  };
  const pauseResumeTimer = () => {
    if (timerRunning) {
      clearInterval(timerIntervalRef.current);
      timerIntervalRef.current = null;
      setTimerRunning(false);
    } else {
      setTimerRunning(true);
      timerIntervalRef.current = setInterval(() => setTimerSeconds((s) => s + 1), 1000);
    }
  };
  const endNormalTimer = () => {
    if (timerIntervalRef.current) {
      clearInterval(timerIntervalRef.current);
      timerIntervalRef.current = null;
    }
    setTimerRunning(false);
    const minutes = timerSeconds / 60;
    setPendingMinutes(minutes);

    const today = todayStr();
    const day = masterLog[today] || emptyDay();
    const newTotal = (day.normalMinutes || 0) + minutes;
    const thresholds = [
      { key: "m10", min: 10, reward: 1 },
      { key: "m30", min: 30, reward: 2 },
      { key: "m60", min: 60, reward: 3 },
    ];
    let awarded = 0;
    const newMilestones = { ...day.milestones };
    thresholds.forEach((t) => {
      if (!newMilestones[t.key] && newTotal >= t.min) {
        newMilestones[t.key] = true;
        awarded += t.reward;
      }
    });
    setPendingAwarded(awarded);
    setNormalNote("");
    // 実際の反映はメモ画面の確定時にまとめて行う（下書き状態としてここでは保持のみ）
    window.__pendingNormalDay = { today, day, newTotal, newMilestones, awarded };
    setScreen("normalMemo");

    const pending = window.__pendingNormalDay;
    if (!pending) {
      setScreen("home");
      return;
    }
    const { today, day, newTotal, newMilestones, awarded } = pending;
    const newEntries = note && note.trim() ? [...day.entries, { type: "note", full: note.trim(), summary: summarizeText(note.trim()), time: new Date().toISOString() }] : day.entries;
    const newDay = { ...day, normalMinutes: newTotal, milestones: newMilestones, entries: newEntries };
    const newMasterLog = { ...masterLog, [today]: newDay };
    const newWallet = walletPoints + awarded;
    const newStreak = registerPracticeDay(today);
    setMasterLog(newMasterLog);
    setWalletPoints(newWallet);
    persist({ masterLog: newMasterLog, walletPoints: newWallet, lastPracticeDate: today, streak: newStreak });
    window.__pendingNormalDay = null;
    setScreen("home");
  };

  /* ============ カメラ練習 ============ */
  useEffect(() => {
    if (screen !== "timer") return;
    const t1 = setInterval(() => setElapsed((e) => e + 1), 1000);
    const t2 = setInterval(() => setCheer(CHEERS[Math.floor(Math.random() * CHEERS.length)]), 3500);
    return () => {
      clearInterval(t1);
      clearInterval(t2);
    };
  }, [screen]);

  const startCameraFlow = (m) => {
    setMode(m);
    setBeforeUrl(null);
    setAfterUrl(null);
    setTeacherUrl(null);
    setOwnUrl(null);
    setBeforeCurve(null);

    setLeftAspect(null);
    setRightAspect(null);
    setScreen(m === "self" ? "before" : "teacherUpload");
  };

  const runAnalysis = async (curves) => {
    setScreen("analyzing");
    try {
      let s;
      if (mode === "self") {
        s = compareSelf(curves.before.curve, curves.after.curve);
      } else {
        s = compareToTeacher(curves.own.curve, curves.teacher.curve);
      }
      setScore(s);
      const randomAnimal = ["dog", "cat", "chick"][Math.floor(Math.random() * 3)];
      setPraiseAnimal(randomAnimal);
      setPraiseMessage(buildPraise(randomAnimal, s));

      const today = todayStr();
      const day = masterLog[today] || emptyDay();
      const newDay = {
        ...day,
        cameraSessions: (day.cameraSessions || 0) + 1,
        cameraMinutes: (day.cameraMinutes || 0) + elapsed / 60,
      };
      const newMasterLog = { ...masterLog, [today]: newDay };
      const CAMERA_REWARD = 3;
      const newWallet = walletPoints + CAMERA_REWARD;
      const newStreak = registerPracticeDay(today);

      setMasterLog(newMasterLog);
      setWalletPoints(newWallet);
      persist({ masterLog: newMasterLog, walletPoints: newWallet, lastPracticeDate: today, streak: newStreak });

      setScreen("result");
      setTimeout(() => setBurst(true), 300);
      setTimeout(() => setBurst(false), 2200);
    } catch (e) {
      setError("うまく比べられなかったよ。もう一度ためしてね。（" + (e?.message || "不明なエラー") + "）");
      setScreen("result");
    }
  };

  const saveReflection = (text) => {
    const today = todayStr();
    const day = masterLog[today] || emptyDay();
    const entry = { type: "reflection", full: text, summary: summarizeText(text), time: new Date().toISOString() };
    const newDay = { ...day, entries: [...day.entries, entry] };
    const newMasterLog = { ...masterLog, [today]: newDay };
    setMasterLog(newMasterLog);
    persist({ masterLog: newMasterLog });
  };

  if (!loaded) {
    return (
      <div className="app-root loading">
        <style>{GLOBAL_CSS}</style>
        <div style={{ fontSize: "3rem" }}>🐾</div>
        <p>よみこみ中...</p>
      </div>
    );
  }

  const health = calcHealth(lastPracticeDate);
  const tier = healthTier(health);
  const a = animal ? ANIMALS[animal] : null;
  const stageIdx = animal ? (animal === "chick" ? Math.min(getStageIndex(progress[animal]), 3) : getStageIndex(progress[animal])) : 0;
  const todayEntryCount = (masterLog[todayStr()]?.entries || []).length;

  return (
    <div className="app-root">
      <style>{GLOBAL_CSS}</style>

      {screen === "home" && (
        <div className="screen home-screen">
          <h1 className="title">コツコツダンスペット</h1>
          <p className="build-tag-top">build 2026-08-14-f</p>
          <div className="wallet-badge">
            🍖 ポイント: {walletPoints}　{streak > 0 && <span>🔥 {streak}日れんぞく</span>}
          </div>

          <MasterCalendar masterLog={masterLog} />

          <div className="menu-row">
            <button className="menu-card" onClick={startNormalPractice}>
              🧘‍♀️
              <div>ノーマル練習</div>
              <span className="menu-card-sub">ストレッチ・体幹・ふり覚えなど</span>
            </button>
            <button
              className="menu-card camera"
              onClick={() => setScreen("cameraMode")}
            >
              🎥
              <div>カメラ練習</div>
              <span className="menu-card-sub">動画をとって比べる（+3pt）</span>
            </button>
          </div>

          <div className="rooms-row-label">おへや</div>
          <div className="rooms-row">
            {Object.keys(ANIMALS).map((k) => {
              const stIdx = Math.min(getStageIndex(progress[k]), 3);
              return (
                <button
                  key={k}
                  className="room-mini-card"
                  style={{ background: ANIMALS[k].roomBg }}
                  onClick={() => {
                    setAnimal(k);
                    setScreen("room");
                  }}
                >
                  <CharacterArt animal={k} stageIdx={stIdx} sizeMult={0.8} />
                  <div className="room-mini-name">{petNames[k] || ANIMALS[k].name}</div>
                  {dirtiness[k] > 0 && <span className="room-mini-mess">💩{dirtiness[k]}</span>}
                </button>
              );
            })}
          </div>

          <SyncSettings currentCode={syncCode} onApply={applySyncCode} status={syncStatus} firebaseReady={firebaseReady} />
          <BackupPanel getSnapshotJson={getSnapshotJson} onRestore={restoreFromSnapshot} />
        </div>
      )}

      {screen === "room" && animal && (
        <div className="screen hub-screen">
          <button className="back-link" onClick={() => setScreen("home")}>
            ◀ ホームにもどる
          </button>

          <div className="room-view" style={{ background: a.roomBg }}>
            <div className="room-floor" style={{ background: a.floor }} />
            <RoomDecorations owned={decorations[animal]} editable={editMode} onDragEnd={moveItem} />
            <RoomMess count={dirtiness[animal]} />
            <RoomCharacter animal={animal} totalSnacks={progress[animal]} health={health} size={1.3} wander={!editMode} />
            {feedBurst && (
              <div className="sparkle-burst" style={{ right: "40%" }}>
                <span>🍖</span>
                <span>💕</span>
              </div>
            )}
            {tier.msg && !editMode && (
              <div className="mood-bubble">
                <strong>{tier.label}</strong>
                <div>{tier.msg}</div>
              </div>
            )}
            {editMode && <div className="edit-hint">かぐをドラッグして動かせるよ ✋</div>}
          </div>

          <div className="btn-row">
            <button className="feed-btn" disabled={walletPoints < 1} onClick={() => feedPet(animal)}>
              🍖 えさをあげる（-1pt）
            </button>
            {dirtiness[animal] > 0 && (
              <button className="clean-btn" disabled={walletPoints < 2} onClick={() => cleanRoom(animal)}>
                🧹 おそうじ（-2pt）
              </button>
            )}
          </div>

          <button className={`layout-toggle-btn ${editMode ? "active" : ""}`} onClick={() => setEditMode(!editMode)}>
            {editMode ? "✅ レイアウトかんりょう" : "🖐️ 部屋をととのえる"}
          </button>

          <div className="stat-row">
            <div className="stat-box">
              <div className="stat-label">なまえ</div>
              <div className="stat-value">{petNames[animal] ? petNames[animal] : a.name}</div>
              {petNames[animal] && <div className="stat-sublabel">{a.name}</div>}
            </div>
            <div className="stat-box">
              <div className="stat-label">せいちょう</div>
              <div className="stat-value">{STAGE_META[stageIdx].label}</div>
            </div>
            <div className="stat-box">
              <div className="stat-label">げんき度（みんな共通）</div>
              <div className="health-bar">
                <div className="health-fill" style={{ width: `${health}%`, background: health >= 65 ? "#35B192" : health >= 35 ? "#FFC94A" : "#E05555" }} />
              </div>
            </div>
          </div>

          <div className="snack-tracker">
            🍖 このこにあげたおやつ {progress[animal]}こ
            {STAGE_META[stageIdx + 1] && (
              <span className="snack-tracker-next">
                （つぎの成長まであと{STAGE_META[stageIdx + 1].min - progress[animal]}こ）
              </span>
            )}
          </div>

          {stageIdx >= 1 && !petNames[animal] && <PetNamer onNameSet={setPetName} />}

          <RoomShop roomPoints={walletPoints} owned={decorations[animal]} onBuy={buyItem} />
        </div>
      )}

      {screen === "normalTimer" && (
        <div className="screen timer-screen">
          <div className="normal-timer-display">
            {String(Math.floor(timerSeconds / 60)).padStart(2, "0")}:{String(timerSeconds % 60).padStart(2, "0")}
          </div>
          <p className="timer-caption">ストレッチ・体幹・ふり覚え…すきな練習をしてね</p>
          <div className="btn-row">
            <button className="primary-btn" onClick={pauseResumeTimer}>
              {timerRunning ? "⏸ 一時停止" : "▶ さいかい"}
            </button>
            <button className="cta-btn" style={{ background: "#E05555" }} onClick={endNormalTimer}>
              ⏹ 終了する
            </button>
          </div>
        </div>
      )}

      {screen === "normalMemo" && (
        <div className="screen">
          <h2 className="title" style={{ fontSize: "1.1rem" }}>
            おつかれさま！
          </h2>
          <div className="score-dial">{Math.round(pendingMinutes)}ぷん</div>
          {pendingAwarded > 0 && <p className="cal-legend">🍖 +{pendingAwarded}pt もらったよ！</p>}
          <p className="cal-legend">明日の自分へメッセージを書ける？（書かなくてもポイントはおなじだよ）</p>
          <textarea
            className="reflection-textarea"
            value={normalNote}
            onChange={(e) => setNormalNote(e.target.value)}
            placeholder="例）明日はもっと大きく手を動かす！"
          />
          <div className="btn-row">
            <button className="ghost-btn" onClick={() => confirmNormalMemo("")}>
              かかずにおわる
            </button>
            <button className="primary-btn" onClick={() => confirmNormalMemo(normalNote)}>
              ほぞんする
            </button>
          </div>
        </div>
      )}

      {screen === "cameraMode" && (
        <div className="screen">
          <button className="back-link" onClick={() => setScreen("home")}>
            ◀ ホームにもどる
          </button>
          <h2 className="title" style={{ fontSize: "1.2rem" }}>
            🎥 カメラ練習
          </h2>
          <div className="mode-toggle">
            <button className={`mode-btn ${mode === "self" ? "active" : ""}`} onClick={() => setMode("self")}>
              📹 自分と比べる
            </button>
            <button className={`mode-btn ${mode === "teacher" ? "active" : ""}`} onClick={() => setMode("teacher")}>
              👩‍🏫 先生と比べる
            </button>
          </div>
          <button className="cta-btn" onClick={() => startCameraFlow(mode)}>
            はじめる ▶
          </button>
        </div>
      )}

      {screen === "before" && (
        <div className="screen">
          <CameraRecorder
            label="① 練習まえのダンスをとろう"
            mirrored={mirrored}
            setMirrored={setMirrored}
            onCaptured={(url, curve) => {
              setBeforeUrl(url);
              setBeforeCurve(curve);
              setScreen("timer");
            }}
          />
        </div>
      )}

      {screen === "teacherUpload" && (
        <div className="screen">
          <div className="capture-wrap">
            <div className="step-label">① 先生のお手本動画を入れよう</div>
            <div className="video-frame upload-frame">
              {teacherUrl ? (
                <video ref={teacherVideoRef} src={teacherUrl} controls muted playsInline />
              ) : (
                <div className="upload-btn-wrap big">
                  <span className="upload-btn-label">先生の動画をえらぶ 🎥</span>
                  <input
                    type="file"
                    accept="video/*"
                    className="upload-input-overlay"
                    onChange={(e) => {
                      const f = e.target.files?.[0];
                      if (f) {
                        setTeacherUrl(URL.createObjectURL(f));
                        setTeacherConfirmError(null);
                      }
                    }}
                  />
                </div>
              )}
            </div>
            {teacherConfirmError && <p className="cam-warning">{teacherConfirmError}</p>}
            {teacherUrl && (
              <button
                className="primary-btn"
                disabled={teacherConfirming}
                onClick={async () => {
                  setTeacherConfirming(true);
                  setTeacherConfirmError(null);
                  try {
                    const video = teacherVideoRef.current;
                    if (!video) throw new Error("動画の準備ができていません");
                    const curve = await extractMotionCurveFromElement(video);
                    setTeacherCurve(curve);
                    setScreen("timer");
                  } catch (e) {
                    setTeacherConfirmError("うまく読み取れなかったよ。別の動画を選ぶか、もう一度試してね。");
                  } finally {
                    setTeacherConfirming(false);
                  }
                }}
              >
                {teacherConfirming ? "かいせき中..." : "これでOK！"}
              </button>
            )}
          </div>
        </div>
      )}

      {screen === "timer" && (
        <div className="screen timer-screen">
          <div className="bounce-loop" style={{ fontSize: "3.5rem" }}>
            💃
          </div>
          <div className="speech-bubble">{cheer}</div>
          <div className="timer-count">
            {String(Math.floor(elapsed / 60)).padStart(2, "0")}:{String(elapsed % 60).padStart(2, "0")}
          </div>
          <p className="timer-caption">
            {mode === "teacher" ? "先生の動画を見ながらいっしょに踊ってみよう！" : "すきなだけ練習してね！"}
          </p>
          <button className="cta-btn" onClick={() => setScreen(mode === "self" ? "after" : "own")}>
            れんしゅう終わり！ ▶
          </button>
        </div>
      )}

      {screen === "after" && (
        <div className="screen">
          <CameraRecorder
            label="② 練習あとのダンスをとろう"
            mirrored={mirrored}
            setMirrored={setMirrored}
            onCaptured={(url, curve) => {
              setAfterUrl(url);
              setAfterCurve(curve);
              runAnalysis({ before: beforeCurve, after: curve });
            }}
          />
        </div>
      )}

      {screen === "own" && (
        <div className="screen">
          <CameraRecorder
            label="② 自分のダンスをとろう"
            mirrored={mirrored}
            setMirrored={setMirrored}
            onCaptured={(url, curve) => {
              setOwnUrl(url);
              setOwnCurve(curve);
              runAnalysis({ teacher: teacherCurve, own: curve });
            }}
          />
        </div>
      )}

      {screen === "analyzing" && (
        <div className="screen center-screen">
          <div className="bounce-loop" style={{ fontSize: "4rem" }}>
            🔍
          </div>
          <p>くらべているよ...</p>
        </div>
      )}

      {screen === "result" && (
        <div className="screen result-screen">
          {error ? (
            <>
              <p className="error-text">{error}</p>
              <button className="primary-btn" onClick={() => setScreen("home")}>
                ホームにもどる
              </button>
            </>
          ) : (
            <>
              <div
                className={`video-pair ${
                  (leftAspect && leftAspect < 1) || (rightAspect && rightAspect < 1) ? "has-portrait" : "has-landscape"
                }`}
              >
                <div className="video-pair-item">
                  <div className="video-pair-label">{mode === "self" ? "れんしゅうまえ" : "せんせいのお手本"}</div>
                  <video
                    ref={leftVideoRef}
                    src={mode === "self" ? beforeUrl : teacherUrl}
                    controls
                    playsInline
                    muted
                    style={leftAspect ? { aspectRatio: leftAspect } : undefined}
                    onLoadedMetadata={(e) => {
                      const v = e.target;
                      if (v.videoWidth && v.videoHeight) setLeftAspect(v.videoWidth / v.videoHeight);
                    }}
                  />
                </div>
                <div className="video-pair-item">
                  <div className="video-pair-label">{mode === "self" ? "れんしゅうあと" : "じぶんのダンス"}</div>
                  <video
                    ref={rightVideoRef}
                    src={mode === "self" ? afterUrl : ownUrl}
                    controls
                    playsInline
                    muted
                    style={rightAspect ? { aspectRatio: rightAspect } : undefined}
                    onLoadedMetadata={(e) => {
                      const v = e.target;
                      if (v.videoWidth && v.videoHeight) setRightAspect(v.videoWidth / v.videoHeight);
                    }}
                  />
                </div>
              </div>
              <button
                className="sync-play-btn"
                onClick={() => {
                  const lv = leftVideoRef.current;
                  const rv = rightVideoRef.current;
                  const leftCurves = mode === "self" ? beforeCurve : teacherCurve;
                  const rightCurves = mode === "self" ? afterCurve : ownCurve;
                  if (!lv || !rv) return;
                  try {
                    lv.currentTime = leftCurves?.startTime || 0;
                    rv.currentTime = rightCurves?.startTime || 0;
                  } catch {
                    /* noop */
                  }
                  lv.play();
                  rv.play();
                }}
              >
                ▶ 動き出しから同時にさいせい
              </button>
              <div className="score-dial">{score}てん</div>
              <div className={`result-char ${burst ? "celebrate" : ""}`}>
                <CharacterArt animal={praiseAnimal} stageIdx={Math.min(getStageIndex(progress[praiseAnimal]), 3)} sizeMult={1.3} />
                {burst && (
                  <div className="sparkle-burst">
                    <span>✨</span>
                    <span>🍖</span>
                    <span>✨</span>
                  </div>
                )}
              </div>
              {burst && (
                <div className="celebration-toast">
                  <div className="celebration-title">🎉 おめでとう！</div>
                  <div className="celebration-sub">ポイント追加 🍖 +3</div>
                </div>
              )}
              {praiseMessage && <div className="speech-bubble praise-bubble">{praiseMessage}</div>}
              <p className="result-message">今日もおつかれさま！</p>
              <ReflectionRecorder onSaved={(text) => saveReflection(text)} alreadyRecordedToday={todayEntryCount > 0} />
              <button className="cta-btn" onClick={() => setScreen("home")}>
                ホームにもどる
              </button>
            </>
          )}
        </div>
      )}
    </div>
  );
}

.primary-btn{padding:14px 22px;border:none;border-radius:16px;background:var(--teal);color:white;font-weight:800;box-shadow:0 5px 0 #22836b;cursor:pointer;}
.ghost-btn{padding:14px 22px;border-radius:16px;background:transparent;border:2px solid #cfd8d4;color:var(--ink);font-weight:700;cursor:pointer;}
.btn-row{display:flex;gap:10px;width:100%;justify-content:center;}

.step-label{font-weight:800;font-size:1rem;}
.capture-wrap{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;}
.video-frame{position:relative;width:100%;aspect-ratio:3/4;background:#111;border-radius:24px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.video-frame video{width:100%;height:100%;object-fit:cover;}
.upload-frame{background:#f0efe9;}
.mirror-btn{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.85);border:none;border-radius:999px;width:38px;height:38px;font-size:1.1rem;cursor:pointer;}
.frame-guide{position:absolute;inset:0;pointer-events:none;}
.frame-guide-line{position:absolute;background:rgba(255,255,255,.35);}
.frame-guide-line.v1{left:33.3%;top:0;bottom:0;width:1px;}
.frame-guide-line.v2{left:66.6%;top:0;bottom:0;width:1px;}
.frame-guide-line.h1{top:33.3%;left:0;right:0;height:1px;}
.frame-guide-line.h2{top:66.6%;left:0;right:0;height:1px;}
.frame-hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#fff;font-size:.7rem;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none;}
.record-btn{padding:14px 28px;border-radius:999px;border:none;background:var(--coral);color:white;font-weight:800;font-size:1rem;box-shadow:0 5px 0 #d9694a;cursor:pointer;}
.record-btn.recording{background:#d94848;box-shadow:0 5px 0 #a53232;}
.cam-error{color:white;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;padding:0 16px;}
.cam-error-title{font-weight:800;font-size:.95rem;margin:0;}
.cam-error-detail{font-size:.75rem;opacity:.85;margin:0;}
.cam-warning{color:#a53232;font-weight:700;font-size:.8rem;text-align:center;}
.build-tag{align-self:flex-end;font-size:.6rem;color:#b7c2bd;}
.build-tag-top{font-size:.65rem;color:#8a9690;margin:0;font-weight:700;}
.upload-btn{background:var(--sun);color:var(--ink);padding:10px 18px;border-radius:14px;font-weight:800;cursor:pointer;}
.upload-btn.big{padding:22px 26px;font-size:1rem;}
.upload-btn-wrap{position:relative;display:inline-block;border-radius:14px;overflow:hidden;background:var(--sun);}
.upload-btn-wrap.big .upload-btn-label{padding:22px 26px;font-size:1rem;}
.upload-btn-label{display:block;padding:10px 18px;font-weight:800;color:var(--ink);pointer-events:none;text-align:center;}
.upload-input-overlay{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0;}

.timer-screen{align-items:center;text-align:center;padding-top:20px;}
.speech-bubble{background:var(--card);border-radius:16px;padding:8px 16px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.06);}
.praise-bubble{text-align:center;font-size:.85rem;}
.timer-count{font-size:2.4rem;font-weight:800;letter-spacing:.05em;}
.timer-caption{font-size:.85rem;color:#5b6b64;}

.center-screen{align-items:center;justify-content:center;min-height:50vh;}

.result-screen{align-items:center;}
.video-pair{display:flex;gap:8px;width:100%;}
.video-pair.has-landscape{flex-direction:column;}
.video-pair-item{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
.video-pair-label{font-size:.68rem;font-weight:700;color:#5b6b64;text-align:center;}
.video-pair video{width:100%;border-radius:16px;background:#111;aspect-ratio:3/4;object-fit:contain;}
.score-dial{font-size:2rem;font-weight:900;color:var(--coral);}
.result-char{position:relative;}
.result-char.celebrate{animation:joyMotion 1.1s ease;}
@keyframes joyMotion{
  0%{transform:scale(1) rotate(0deg) translateY(0);}
  20%{transform:scale(1.25) rotate(-8deg) translateY(-12px);}
  40%{transform:scale(1.1) rotate(8deg) translateY(-22px);}
  60%{transform:scale(1.25) rotate(-6deg) translateY(-10px);}
  80%{transform:scale(1.05) rotate(4deg) translateY(-4px);}
  100%{transform:scale(1) rotate(0deg) translateY(0);}
}
.sparkle-burst{position:absolute;top:-10px;right:-30px;display:flex;gap:4px;font-size:1.3rem;animation:rise 1.8s ease forwards;}
@keyframes rise{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(-40px);opacity:0;}}
.celebration-toast{background:linear-gradient(135deg,var(--sun),var(--coral));border-radius:16px;padding:10px 20px;text-align:center;color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.15);animation:toastPop .5s ease;}
.celebration-title{font-weight:900;font-size:1.05rem;}
.celebration-sub{font-weight:700;font-size:.8rem;opacity:.95;}
@keyframes toastPop{0%{transform:scale(.4);opacity:0;}60%{transform:scale(1.08);opacity:1;}100%{transform:scale(1);}}
.result-message{font-weight:800;font-size:1rem;}
.error-text{font-weight:700;color:#a53232;}

/* カレンダー */
.calendar-card{width:100%;background:var(--card);border-radius:20px;padding:14px;box-shadow:0 4px 0 rgba(0,0,0,.05);}
.cal-title{font-weight:800;font-size:.9rem;margin-bottom:8px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-head{margin-bottom:4px;}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font-size:.7rem;position:relative;}
.cal-cell.head{font-weight:800;color:#8a9690;background:none;}
.cal-cell.empty{background:none;}
.cal-cell.done{background:#FFF3D2;}
.cal-cell.today{outline:2px solid var(--coral);}
.cal-day-num{font-size:.65rem;color:#5b6b64;}
.cal-stamp{font-size:.85rem;margin-top:-2px;}
.cal-legend{margin-top:6px;font-size:.68rem;color:#8a9690;}
.cal-cell-btn{border:none;background:none;font-family:inherit;cursor:pointer;position:relative;}
.cal-cell-btn.selected{outline:2px solid var(--teal);}
.cal-note-dot{position:absolute;top:1px;right:1px;font-size:.55rem;}
.cal-reflection-view{margin-top:10px;background:#F7F5EF;border-radius:14px;padding:10px 12px;}
.cal-reflection-date{font-weight:800;font-size:.78rem;margin-bottom:4px;}
.cal-reflection-text{font-size:.8rem;line-height:1.5;white-space:pre-wrap;}
.cal-reflection-full{margin-top:6px;font-size:.75rem;color:#5b6b64;}
.cal-reflection-full summary{cursor:pointer;font-weight:700;}
.cal-minutes{font-size:.5rem;color:var(--coral);font-weight:800;}
.week-banner{background:linear-gradient(135deg,var(--sun),var(--coral));color:#fff;border-radius:12px;padding:8px 10px;font-size:.75rem;font-weight:800;margin-bottom:8px;text-align:center;}
.month-total-badge{margin-top:10px;background:#F0F7F2;border-radius:12px;padding:8px 10px;font-size:.75rem;font-weight:800;color:#2E6B52;text-align:center;}

/* トップ画面 */
.wallet-badge{width:100%;text-align:center;background:var(--card);border-radius:14px;padding:8px;font-weight:800;font-size:.85rem;box-shadow:0 3px 0 rgba(0,0,0,.05);}
.menu-row{display:flex;gap:10px;width:100%;}
.menu-card{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px 8px;border:none;border-radius:18px;background:var(--card);font-size:1.8rem;font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.06);cursor:pointer;}
.menu-card div{font-size:.85rem;}
.menu-card.camera{background:linear-gradient(135deg,#FFE9C7,#FFD9A8);}
.menu-card-sub{font-size:.6rem;color:#8a9690;font-weight:500;}
.rooms-row-label{align-self:flex-start;font-size:.75rem;font-weight:800;color:#8a9690;}
.rooms-row{display:flex;gap:8px;width:100%;}
.room-mini-card{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border:none;border-radius:16px;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.06);cursor:pointer;}
.room-mini-name{font-size:.65rem;font-weight:800;}
.room-mini-mess{position:absolute;top:4px;right:4px;font-size:.6rem;}
.feed-btn{flex:1;padding:12px;border:none;border-radius:16px;background:var(--coral);color:#fff;font-weight:800;font-size:.85rem;cursor:pointer;box-shadow:0 4px 0 #d9694a;}
.feed-btn:disabled{opacity:.5;}
.normal-timer-display{font-size:3rem;font-weight:900;letter-spacing:.05em;}
.cal-reflection-entry{margin-top:6px;padding-top:6px;border-top:1px solid #e6e2d6;}
.cal-reflection-entry:first-of-type{margin-top:0;padding-top:0;border-top:none;}
.cal-stamp-cat{filter:hue-rotate(210deg);}
.cal-stamp-chick{filter:hue-rotate(45deg) saturate(1.3);}

/* ペットの名前づけ */
.pet-namer{width:100%;background:var(--card);border-radius:16px;padding:12px;box-shadow:0 3px 0 rgba(0,0,0,.05);}
.pet-namer-row{display:flex;gap:8px;margin-top:6px;}
.pet-namer-input{flex:1;border-radius:12px;border:1px solid #e0ddd3;padding:8px 10px;font-family:inherit;font-size:.85rem;}

/* 端末間どうき設定 */
.sync-settings{width:100%;margin-top:8px;}
.sync-toggle{width:100%;background:none;border:none;color:#8a9690;font-size:.75rem;font-weight:700;cursor:pointer;padding:6px;}
.sync-panel{background:var(--card);border-radius:14px;padding:12px;margin-top:6px;display:flex;flex-direction:column;gap:6px;box-shadow:0 3px 0 rgba(0,0,0,.05);}
.restore-btn{width:100%;margin-top:8px;padding:10px;border:none;border-radius:14px;background:var(--sun);color:var(--ink);font-weight:800;font-size:.78rem;cursor:pointer;}

/* 反省ノート */
.reflection-card{width:100%;background:var(--card);border-radius:20px;padding:14px;box-shadow:0 4px 0 rgba(0,0,0,.05);display:flex;flex-direction:column;gap:8px;}
.mic-btn{padding:12px;border:none;border-radius:16px;background:var(--sun);font-weight:800;cursor:pointer;}
.mic-btn.listening{background:#E05555;color:white;}
.reflection-textarea{width:100%;min-height:70px;border-radius:12px;border:1px solid #e0ddd3;padding:8px;font-family:inherit;font-size:.85rem;resize:vertical;}
.backup-textarea{min-height:90px;font-size:.65rem;font-family:monospace;word-break:break-all;}

/* 同時さいせいボタン */
.sync-play-btn{width:100%;padding:12px;border:none;border-radius:16px;background:var(--teal);color:white;font-weight:800;font-size:.85rem;cursor:pointer;}

/* ショップ */
.shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.shop-item{border:none;background:#F7F5EF;border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.05);}
.shop-item:disabled{cursor:default;}
.shop-item.owned{background:#E4F5EC;}
.shop-emoji{font-size:1.5rem;}
.shop-name{font-size:.72rem;font-weight:700;}
.shop-cost{font-size:.66rem;color:#8a9690;}

@media (orientation:landscape){
  .app-root{padding:10px;}
  .screen{max-width:900px;}
  .capture-wrap{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:flex-start;}
  .video-frame{aspect-ratio:16/9;max-width:560px;flex:1;min-width:280px;}
  .door-list{flex-direction:row;}
  .door-card{flex:1;}
}
@media (min-width:820px){
  .screen{max-width:1100px;}
  .video-pair.has-landscape{flex-direction:row;gap:28px;}
  .video-pair{gap:28px;}
  .video-pair-label{font-size:.85rem;}
}
`;

</body>
