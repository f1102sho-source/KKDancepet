/* このファイルを外部ホスティングで開いたとき用の window.storage 代替
   （Claudeのアーティファクト内であれば元々の window.storage をそのまま使う） */
if (!window.storage) {
  window.storage = {
    async get(key) {
      const v = localStorage.getItem(key);
      if (v === null) throw new Error("not found");
      return { key, value: v };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value };
    },
    async delete(key) {
      localStorage.removeItem(key);
      return { key, deleted: true };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix };
    },
  };
}

function todayStr(offset = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0, 10);
}

function daysBetween(a, b) {
  return Math.round((new Date(a) - new Date(b)) / 86400000);
}

/* げんき度：最後に練習した日からの経過日数で決まる（保存しておく必要はない） */
function calcHealth(lastDate) {
  if (!lastDate) return 75;
  const diff = daysBetween(todayStr(), lastDate);
  if (diff <= 1) return 100;
  return Math.max(0, 100 - (diff - 1) * 22);
}

}

/* ============ 動画のモーション解析（簡易プロトタイプ版） ============ */
function seekTo(video, t, timeoutMs = 2500) {
  return new Promise((resolve) => {
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      video.removeEventListener("seeked", handler);
      resolve();
    };
    const handler = () => finish();
    video.addEventListener("seeked", handler);
    try {
      video.currentTime = t;
    } catch {
      finish();
      return;
    }
    setTimeout(finish, timeoutMs); // seekedが来ない場合でも先に進める
  });
}

/* Chromeなどでは MediaRecorder のブロブ動画の duration が Infinity になることがあり、
   そのままだとシークができない。大きな値へ一度シークして長さを確定させる対処。 */
function fixDuration(video) {
  return new Promise((resolve) => {
    if (video.duration && isFinite(video.duration) && video.duration > 0) {
      resolve();
      return;
    }
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      video.removeEventListener("timeupdate", onTimeUpdate);
      video.currentTime = 0;
      resolve();
    };
    const onTimeUpdate = () => finish();
    video.addEventListener("timeupdate", onTimeUpdate);
    try {
      video.currentTime = 1e7;
    } catch {
      finish();
      return;
    }
    setTimeout(finish, 2500);
  });
}

/* 既に読み込み済みの<video>要素からモーション曲線を取り出す。
   （新しくvideo要素を作って同じ動画を読み込み直すと、端末によって
   「対応していない形式」として弾かれることがあるため、それを避ける） */
async function extractMotionCurveFromElement(video, samples = 10) {
  await fixDuration(video);
  let duration = video.duration;
  if (!duration || !isFinite(duration) || duration <= 0) duration = 3;
  const canvas = document.createElement("canvas");
  canvas.width = 48;
  canvas.height = 48;
  const ctx = canvas.getContext("2d");
  let prev = null;
  const energies = [];
  const originalTime = video.currentTime;
  for (let i = 0; i < samples; i++) {
    const t = (duration * i) / Math.max(samples - 1, 1);
    await seekTo(video, Math.min(t, Math.max(duration - 0.05, 0)));
    ctx.drawImage(video, 0, 0, 48, 48);
    const frame = ctx.getImageData(0, 0, 48, 48).data;
    if (prev) {
      let diff = 0;
      for (let p = 0; p < frame.length; p += 4) {
        diff +=
          Math.abs(frame[p] - prev[p]) +
          Math.abs(frame[p + 1] - prev[p + 1]) +
          Math.abs(frame[p + 2] - prev[p + 2]);
      }
      energies.push(diff);
    }
    prev = frame;
  }
  try {
    video.currentTime = originalTime || 0;
  } catch {
    /* noop */
  }
  const max = Math.max(...energies, 1);
  return energies.map((e) => e / max);
}

function compareSelf(before, after) {
  const sum = (arr) => arr.reduce((a, b) => a + b, 0);
  const b = sum(before) || 0.001;
  const a = sum(after);
  const improvement = (a - b) / b;
  return Math.max(0, Math.min(100, Math.round(50 + improvement * 90)));
}

function compareToTeacher(mine, teacher) {
  const len = Math.min(mine.length, teacher.length);
  let dot = 0,
    magA = 0,
    magB = 0;
  for (let i = 0; i < len; i++) {
    dot += mine[i] * teacher[i];
    magA += mine[i] * mine[i];
    magB += teacher[i] * teacher[i];
  }
  const denom = Math.sqrt(magA) * Math.sqrt(magB) || 0.001;
  const sim = Math.max(0, Math.min(1, dot / denom));
  return Math.round(sim * 100);
}

function fluffRing(cx, cy, r, count, bumpR, color) {
  return Array.from({ length: count }).map((_, i) => {
    const angle = (i / count) * Math.PI * 2;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle) * 0.88;
    return <circle key={i} cx={x} cy={y} r={bumpR} fill={color} />;
  });
}

/* ============ 部屋のかざり（ドラッグで自由配置）・ショップ ============ */
function DraggableDeco({ item, pos, editable, onDragEnd }) {
  const elRef = useRef(null);

  const handlePointerDown = (e) => {
    if (!editable) return;
    e.preventDefault();
    const el = elRef.current;
    const roomEl = el.closest(".room-view");
    if (!roomEl) return;
    el.classList.add("dragging");
    const rect = roomEl.getBoundingClientRect();

    const move = (ev) => {
      const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
      let x = ((clientX - rect.left) / rect.width) * 100;
      let y = ((clientY - rect.top) / rect.height) * 100;
      x = Math.min(92, Math.max(4, x));
      y = Math.min(90, Math.max(6, y));
      el.style.left = `${x}%`;
      el.style.top = `${y}%`;
      el.dataset.x = x;
      el.dataset.y = y;
    };
    const up = () => {
      el.classList.remove("dragging");
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      const x = parseFloat(el.dataset.x ?? pos.x);
      const y = parseFloat(el.dataset.y ?? pos.y);
      onDragEnd(item.id, x, y);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  };

  return (
    <div
      ref={elRef}
      className={`deco-item ${editable ? "draggable" : ""}`}
      style={{ left: `${pos.x}%`, top: `${pos.y}%` }}
      onPointerDown={handlePointerDown}
    >
      {item.emoji}
    </div>
  );
}

/* ============ キャラクター（部屋の中を動き回る） ============ */
function RoomCharacter({ animal, totalSnacks, health, size = 1, wander = true }) {
  const stageIdx = animal === "chick" ? Math.min(getStageIndex(totalSnacks), 3) : getStageIndex(totalSnacks);
  const tier = healthTier(health);
  const isEgg = animal === "chick" && stageIdx === 0;

  return (
    <div className={`room-char-wrap ${wander && !isEgg ? "wander" : ""} ${tier.tier === "sick" ? "slow" : ""}`}>
      <div className="room-char-emoji">
        <CharacterArt animal={animal} stageIdx={stageIdx} sizeMult={size} />
        {tier.icon && <span className="mood-icon">{tier.icon}</span>}
      </div>
      {!isEgg && <div className="char-shadow" />}
    </div>
  );
}

function PracticeCalendar({ practiceLog }) {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startWeekday = firstDay.getDay();
  const logSet = useMemo(() => new Set(practiceLog), [practiceLog]);
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const monthLabel = `${year}年${month + 1}月`;
  const todayDate = now.getDate();

  return (
    <div className="calendar-card">
      <div className="cal-title">📅 {monthLabel}のれんしゅうきろく</div>
      <div className="cal-grid cal-head">
        {["日", "月", "火", "水", "木", "金", "土"].map((w) => (
          <div key={w} className="cal-cell head">
            {w}
          </div>
        ))}
      </div>
      <div className="cal-grid">
        {cells.map((d, i) => {
          if (d === null) return <div key={i} className="cal-cell empty" />;
          const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
          const done = logSet.has(dateStr);
          const isToday = d === todayDate;
          return (
            <div key={i} className={`cal-cell ${done ? "done" : ""} ${isToday ? "today" : ""}`}>
              <span className="cal-day-num">{d}</span>
              {done && <span className="cal-stamp">🐾</span>}
            </div>
          );
        })}
      </div>
      <div className="cal-legend">🐾 = 練習した日</div>
    </div>
  );
}

/* ============ カメラ撮影コンポーネント ============ */
function CameraRecorder({ label, mirrored, setMirrored, onCaptured }) {
  const videoRef = useRef(null);
  const previewVideoRef = useRef(null);
  const streamRef = useRef(null);
  const recorderRef = useRef(null);
  const chunksRef = useRef([]);
  const [recording, setRecording] = useState(false);
  const [camError, setCamError] = useState(null); // {title, detail}
  const [previewUrl, setPreviewUrl] = useState(null);
  const [confirming, setConfirming] = useState(false);
  const [confirmError, setConfirmError] = useState(null);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      if (!window.isSecureContext) {
        setCamError({
          title: "この画面はカメラを使えない設定だよ",
          detail: "アプリとして公開・保存してから開くとカメラが使えるようになるよ。今は下から動画をえらんでね。",
        });
        return;
      }
      if (!navigator.mediaDevices?.getUserMedia) {
        setCamError({
          title: "このブラウザはカメラに対応していないみたい",
          detail: "下から動画ファイルをえらんでね。",
        });
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false,
        });
        if (cancelled) {
          stream.getTracks().forEach((t) => t.stop());
          return;
        }
        streamRef.current = stream;
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          videoRef.current.play().catch(() => {});
        }
      } catch (e) {
        if (cancelled) return;
        if (e.name === "NotAllowedError" || e.name === "SecurityError") {
          setCamError({
            title: "カメラの使用が許可されていないよ",
            detail: "ブラウザの設定でこのアプリのカメラをオンにしてね。今は下から動画をえらべるよ。",
          });
        } else if (e.name === "NotFoundError") {
          setCamError({
            title: "カメラが見つからなかったよ",
            detail: "この端末にカメラがないか、他のアプリが使用中かも。下から動画をえらんでね。",
          });
        } else {
          setCamError({
            title: "カメラを使えなかったよ",
            detail: "今のこの画面（プレビュー）ではカメラがブロックされていることがあるよ。下から動画をえらんでね。",
          });
        }
      }
    })();
    return () => {
      cancelled = true;
      if (streamRef.current) streamRef.current.getTracks().forEach((t) => t.stop());
    };
  }, []);

  const [tooShortWarning, setTooShortWarning] = useState(false);

  const startRecording = () => {
    if (!streamRef.current) return;
    chunksRef.current = [];
    setTooShortWarning(false);
    // ブラウザが実際にサポートしている形式を優先的に選ぶ
    const preferredTypes = [
      "video/webm;codecs=vp8,opus",
      "video/webm;codecs=vp9,opus",
      "video/webm",
      "video/mp4",
    ];
    const supportedType = preferredTypes.find((t) => window.MediaRecorder?.isTypeSupported?.(t));
    const rec = supportedType ? new MediaRecorder(streamRef.current, { mimeType: supportedType }) : new MediaRecorder(streamRef.current);
    rec.ondataavailable = (e) => {
      if (e.data.size > 0) chunksRef.current.push(e.data);
    };
    rec.onstop = () => {
      // 実際に録画で使われた形式（rec.mimeType）をそのままラベルにする。
      // ここが実際の符号化形式とズレていると、再読み込み時に「対応していない形式」として弾かれることがある。
      const actualType = rec.mimeType || supportedType || "video/webm";
      const blob = new Blob(chunksRef.current, { type: actualType });
      if (blob.size < 8000) {
        // 短すぎる/データが空の録画は解析に失敗しやすいので、撮り直しを促す
        setTooShortWarning(true);
        return;
      }
      const url = URL.createObjectURL(blob);
      setPreviewUrl(url);
    };
    rec.start();
    recorderRef.current = rec;
    setRecording(true);
  };

  const stopRecording = () => {
    recorderRef.current?.stop();
    setRecording(false);
  };

  const handleFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    setPreviewUrl(url);
  };

  return (
    <div className="capture-wrap">
      <div className="step-label">{label}</div>
      <div className="video-frame">
        {!previewUrl && !camError && (
          <video
            ref={videoRef}
            autoPlay
            muted
            playsInline
            style={{ transform: mirrored ? "scaleX(-1)" : "none" }}
          />
        )}
        {previewUrl && (
          <video
            ref={previewVideoRef}
            src={previewUrl}
            controls
            playsInline
            muted
            style={{ transform: mirrored ? "scaleX(-1)" : "none" }}
          />
        )}
        {camError && !previewUrl && (
          <div className="cam-error">
            <p className="cam-error-title">{camError.title}</p>
            <p className="cam-error-detail">{camError.detail}</p>
            <div className="upload-btn-wrap">
              <span className="upload-btn-label">動画をえらぶ</span>
              <input type="file" accept="video/*" onChange={handleFile} className="upload-input-overlay" />
            </div>
          </div>
        )}
        {!camError && (
          <button className="mirror-btn" onClick={() => setMirrored(!mirrored)} title="さかさま">
            🔄
          </button>
        )}
      </div>

      {!camError && !previewUrl && (
        <button className={`record-btn ${recording ? "recording" : ""}`} onClick={recording ? stopRecording : startRecording}>
          {recording ? "とめる ■" : "とる ●"}
        </button>
      )}
      {tooShortWarning && !previewUrl && (
        <p className="cam-warning">みじかすぎて上手くとれなかったよ。もう少し長め（2秒くらい）にとってみてね。</p>
      )}
      {confirmError && <p className="cam-warning">{confirmError}</p>}

      {previewUrl && (
        <div className="btn-row">
          <button
            className="ghost-btn"
            onClick={() => {
              setPreviewUrl(null);
              setConfirmError(null);
            }}
          >
            とりなおす
          </button>
          <button
            className="primary-btn"
            disabled={confirming}
            onClick={async () => {
              setConfirming(true);
              setConfirmError(null);
              try {
                const video = previewVideoRef.current;
                if (!video) throw new Error("動画の準備ができていません");
                const curve = await extractMotionCurveFromElement(video);
                onCaptured(previewUrl, curve);
              } catch (e) {
                setConfirming(false);
                setConfirmError("うまく読み取れなかったよ。もう一度「とりなおす」から撮ってみてね。");
              }
            }}
          >
            {confirming ? "かいせき中..." : "これでOK！"}
          </button>
        </div>
      )}
    </div>
  );
}

/* ============ メインアプリ ============ */
function DanceGrowApp() {
  const [loaded, setLoaded] = useState(false);
  const [animal, setAnimal] = useState(null); // null = 部屋選択画面
  const [progress, setProgress] = useState({ dog: 0, cat: 0, chick: 0 });
  const [streak, setStreak] = useState(0);
  const [lastDate, setLastDate] = useState(null);
  const [practiceLog, setPracticeLog] = useState([]);
  const [roomPoints, setRoomPoints] = useState(0);
  const [decorations, setDecorations] = useState({ dog: [], cat: [], chick: [] });

  const [screen, setScreen] = useState("roomSelect");
  const [mode, setMode] = useState("self");
  const [mirrored, setMirrored] = useState(true);
  const [editMode, setEditMode] = useState(false);

  const [beforeUrl, setBeforeUrl] = useState(null);
  const [afterUrl, setAfterUrl] = useState(null);
  const [teacherUrl, setTeacherUrl] = useState(null);
  const [ownUrl, setOwnUrl] = useState(null);
  const [beforeCurve, setBeforeCurve] = useState(null);
  const [afterCurve, setAfterCurve] = useState(null);
  const [teacherCurve, setTeacherCurve] = useState(null);
  const [ownCurve, setOwnCurve] = useState(null);
  const teacherVideoRef = useRef(null);
  const [teacherConfirming, setTeacherConfirming] = useState(false);
  const [teacherConfirmError, setTeacherConfirmError] = useState(null);

  const [elapsed, setElapsed] = useState(0);
  const [cheer, setCheer] = useState(CHEERS[0]);
  const [score, setScore] = useState(null);
  const [awarded, setAwarded] = useState(false);
  const [burst, setBurst] = useState(false);
  const [error, setError] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res?.value) {
          const s = JSON.parse(res.value);
          setProgress(s.progress || { dog: 0, cat: 0, chick: 0 });
          setStreak(s.streak || 0);
          setLastDate(s.lastDate || null);
          setPracticeLog(s.practiceLog || []);
          setRoomPoints(s.roomPoints || 0);
          setDecorations(s.decorations || { dog: [], cat: [], chick: [] });
        }
      } catch {
        // 初回は何もない
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  const persist = useCallback(
    async (next) => {
      try {
        await window.storage.set(
          STORAGE_KEY,
          JSON.stringify({
            progress: next.progress ?? progress,
            streak: next.streak ?? streak,
            lastDate: next.lastDate ?? lastDate,
            practiceLog: next.practiceLog ?? practiceLog,
            roomPoints: next.roomPoints ?? roomPoints,
            decorations: next.decorations ?? decorations,
          }),
          false
        );
      } catch {
        // 保存に失敗しても遊べる
      }
    },
    [progress, streak, lastDate, practiceLog, roomPoints, decorations]
  );

  useEffect(() => {
    if (screen !== "timer") return;
    const t1 = setInterval(() => setElapsed((e) => e + 1), 1000);
    const t2 = setInterval(() => setCheer(CHEERS[Math.floor(Math.random() * CHEERS.length)]), 3500);
    return () => {
      clearInterval(t1);
      clearInterval(t2);
    };
  }, [screen]);

  const enterRoom = (a) => {
    setAnimal(a);
    setScreen("hub");
  };

  const buyItem = (itemId) => {
    const item = ROOM_ITEMS.find((i) => i.id === itemId);
    if (!item || !animal) return;
    const ownedIds = decorations[animal].map((d) => d.id);
    if (ownedIds.includes(itemId) || roomPoints < item.cost) return;
    const count = decorations[animal].length;
    const x = 15 + (count % 4) * 20;
    const y = 22 + Math.floor(count / 4) * 24;
    const newDecorations = { ...decorations, [animal]: [...decorations[animal], { id: itemId, x, y }] };
    const newPoints = roomPoints - item.cost;
    setDecorations(newDecorations);
    setRoomPoints(newPoints);
    persist({ decorations: newDecorations, roomPoints: newPoints });
  };

  const moveItem = (itemId, x, y) => {
    if (!animal) return;
    const newList = decorations[animal].map((d) => (d.id === itemId ? { ...d, x, y } : d));
    const newDecorations = { ...decorations, [animal]: newList };
    setDecorations(newDecorations);
    persist({ decorations: newDecorations });
  };

  const startFlow = (m) => {
    setMode(m);
    setBeforeUrl(null);
    setAfterUrl(null);
    setTeacherUrl(null);
    setOwnUrl(null);
    setBeforeCurve(null);
    setAfterCurve(null);
    setTeacherCurve(null);
    setOwnCurve(null);
    setScore(null);
    setAwarded(false);
    setBurst(false);
    setError(null);
    setElapsed(0);
    setScreen(m === "self" ? "before" : "teacherUpload");
  };

  const runAnalysis = async (curves) => {
    setScreen("analyzing");
    try {
      let s;
      if (mode === "self") {
        s = compareSelf(curves.before, curves.after);
      } else {
        s = compareToTeacher(curves.own, curves.teacher);
      }
      setScore(s);
      const success = s >= 60;
      setAwarded(success);

      const today = todayStr();
      let newStreak = streak;
      if (lastDate !== today) {
        newStreak = lastDate === todayStr(-1) ? streak + 1 : 1;
      }
      const newProgress = { ...progress, [animal]: progress[animal] + (success ? 1 : 0) };
      const isNewDay = !practiceLog.includes(today);
      const newLog = isNewDay ? [...practiceLog, today].slice(-90) : practiceLog;
      const newPoints = isNewDay ? roomPoints + 5 : roomPoints;

      setStreak(newStreak);
      setLastDate(today);
      setProgress(newProgress);
      setPracticeLog(newLog);
      setRoomPoints(newPoints);
      persist({ streak: newStreak, lastDate: today, progress: newProgress, practiceLog: newLog, roomPoints: newPoints });

      setScreen("result");
      if (success) {
        setTimeout(() => setBurst(true), 300);
        setTimeout(() => setBurst(false), 2200);
      }
    } catch (e) {
      setError("うまく比べられなかったよ。もう一度ためしてね。（" + (e?.message || "不明なエラー") + "）");
      setScreen("result");
    }
  };

  if (!loaded) {
    return (
      <div className="app-root loading">
        <style>{GLOBAL_CSS}</style>
        <div style={{ fontSize: "3rem" }}>🐾</div>
        <p>よみこみ中...</p>
      </div>
    );
  }

  const health = calcHealth(lastDate);
  const tier = animal ? healthTier(health) : null;
  const a = animal ? ANIMALS[animal] : null;
  const stageIdx = animal ? (animal === "chick" ? Math.min(getStageIndex(progress[animal]), 3) : getStageIndex(progress[animal])) : 0;

  return (
    <div className="app-root">
      <style>{GLOBAL_CSS}</style>

      {screen === "roomSelect" && (
        <div className="screen room-select-screen">
          <h1 className="title">コツコツダンスペット</h1>
          <p className="build-tag-top">build 2026-08-13-c</p>
          <p className="subtitle">どのおへやに入る？</p>
          <div className="door-list">
            {Object.keys(ANIMALS).map((k) => {
              const stIdx = Math.min(getStageIndex(progress[k]), 3);
              const st = STAGE_META[stIdx];
              return (
                <button key={k} className="door-card" style={{ background: ANIMALS[k].roomBg }} onClick={() => enterRoom(k)}>
                  <div className="door-emoji wander-mini">
                    <CharacterArt animal={k} stageIdx={stIdx} sizeMult={1} />
                  </div>
                  <div className="door-name">{ANIMALS[k].name}のへや</div>
                  <div className="door-stage">{st.label}</div>
                  <div className="door-enter">入る ▶</div>
                </button>
              );
            })}
          </div>
        </div>
      )}

      {screen === "hub" && animal && (
        <div className="screen hub-screen">
          <button className="back-link" onClick={() => setScreen("roomSelect")}>
            ◀ おへやをかえる
          </button>
          <div className="build-tag">build 2026-08-13-c</div>

          <div className="room-view" style={{ background: a.roomBg }}>
            <div className="room-floor" style={{ background: a.floor }} />
            <RoomDecorations owned={decorations[animal]} editable={editMode} onDragEnd={moveItem} />
            {streak > 0 && <div className="streak-badge">🔥 {streak}日れんぞく</div>}
            <RoomCharacter animal={animal} totalSnacks={progress[animal]} health={health} size={1.3} wander={!editMode} />
            {tier.msg && !editMode && (
              <div className="mood-bubble">
                <strong>{tier.label}</strong>
                <div>{tier.msg}</div>
              </div>
            )}
            {editMode && <div className="edit-hint">かぐをドラッグして動かせるよ ✋</div>}
          </div>

          <button className={`layout-toggle-btn ${editMode ? "active" : ""}`} onClick={() => setEditMode(!editMode)}>
            {editMode ? "✅ レイアウトかんりょう" : "🖐️ 部屋をととのえる"}
          </button>

          <div className="stat-row">
            <div className="stat-box">
              <div className="stat-label">なまえ</div>
              <div className="stat-value">{a.name}</div>
            </div>
            <div className="stat-box">
              <div className="stat-label">せいちょう</div>
              <div className="stat-value">{STAGE_META[stageIdx].label}</div>
            </div>
            <div className="stat-box">
              <div className="stat-label">げんき度</div>
              <div className="health-bar">
                <div className="health-fill" style={{ width: `${health}%`, background: health >= 65 ? "#35B192" : health >= 35 ? "#FFC94A" : "#E05555" }} />
              </div>
            </div>
          </div>

          <div className="mode-toggle">
            <button className={`mode-btn ${mode === "self" ? "active" : ""}`} onClick={() => setMode("self")}>
              📹 自分と比べる
            </button>
            <button className={`mode-btn ${mode === "teacher" ? "active" : ""}`} onClick={() => setMode("teacher")}>
              👩‍🏫 先生と比べる
            </button>
          </div>

          <button className="cta-btn" onClick={() => startFlow(mode)}>
            今日の練習をはじめる ▶
          </button>

          <PracticeCalendar practiceLog={practiceLog} />
          <RoomShop roomPoints={roomPoints} owned={decorations[animal]} onBuy={buyItem} />
        </div>
      )}

      {screen === "before" && (
        <div className="screen">
          <CameraRecorder
            label="① 練習まえのダンスをとろう"
            mirrored={mirrored}
            setMirrored={setMirrored}
            onCaptured={(url, curve) => {
              setBeforeUrl(url);
              setBeforeCurve(curve);
              setScreen("timer");
            }}
          />
        </div>
      )}

      {screen === "teacherUpload" && (
        <div className="screen">
          <div className="capture-wrap">
            <div className="step-label">① 先生のお手本動画を入れよう</div>
            <div className="video-frame upload-frame">
              {teacherUrl ? (
                <video ref={teacherVideoRef} src={teacherUrl} controls muted playsInline />
              ) : (
                <div className="upload-btn-wrap big">
                  <span className="upload-btn-label">先生の動画をえらぶ 🎥</span>
                  <input
                    type="file"
                    accept="video/*"
                    className="upload-input-overlay"
                    onChange={(e) => {
                      const f = e.target.files?.[0];
                      if (f) {
                        setTeacherUrl(URL.createObjectURL(f));
                        setTeacherConfirmError(null);
                      }
                    }}
                  />
                </div>
              )}
            </div>
            {teacherConfirmError && <p className="cam-warning">{teacherConfirmError}</p>}
            {teacherUrl && (
              <button
                className="primary-btn"
                disabled={teacherConfirming}
                onClick={async () => {
                  setTeacherConfirming(true);
                  setTeacherConfirmError(null);
                  try {
                    const video = teacherVideoRef.current;
                    if (!video) throw new Error("動画の準備ができていません");
                    const curve = await extractMotionCurveFromElement(video);
                    setTeacherCurve(curve);
                    setScreen("timer");
                  } catch (e) {
                    setTeacherConfirmError("うまく読み取れなかったよ。別の動画を選ぶか、もう一度試してね。");
                  } finally {
                    setTeacherConfirming(false);
                  }
                }}
              >
                {teacherConfirming ? "かいせき中..." : "これでOK！"}
              </button>
            )}
          </div>
        </div>
      )}

      {screen === "timer" && (
        <div className="screen timer-screen">
          <div className="bounce-loop">
            {a ? <CharacterArt animal={animal} stageIdx={stageIdx} sizeMult={1.6} /> : "🐾"}
          </div>
          <div className="speech-bubble">{cheer}</div>
          <div className="timer-count">
            {String(Math.floor(elapsed / 60)).padStart(2, "0")}:{String(elapsed % 60).padStart(2, "0")}
          </div>
          <p className="timer-caption">
            {mode === "teacher" ? "先生の動画を見ながらいっしょに踊ってみよう！" : "すきなだけ練習してね！"}
          </p>
          <button className="cta-btn" onClick={() => setScreen(mode === "self" ? "after" : "own")}>
            れんしゅう終わり！ ▶
          </button>
        </div>
      )}

      {screen === "after" && (
        <div className="screen">
          <CameraRecorder
            label="② 練習あとのダンスをとろう"
            mirrored={mirrored}
            setMirrored={setMirrored}
            onCaptured={(url, curve) => {
              setAfterUrl(url);
              setAfterCurve(curve);
              runAnalysis({ before: beforeCurve, after: curve });
            }}
          />
        </div>
      )}

      {screen === "own" && (
        <div className="screen">
          <CameraRecorder
            label="② 自分のダンスをとろう"
            mirrored={mirrored}
            setMirrored={setMirrored}
            onCaptured={(url, curve) => {
              setOwnUrl(url);
              setOwnCurve(curve);
              runAnalysis({ teacher: teacherCurve, own: curve });
            }}
          />
        </div>
      )}

      {screen === "analyzing" && (
        <div className="screen center-screen">
          <div className="bounce-loop">
            {a ? <CharacterArt animal={animal} stageIdx={stageIdx} sizeMult={1.6} /> : "🐾"}
          </div>
          <p>くらべているよ...🔍</p>
        </div>
      )}

      {screen === "result" && (
        <div className="screen result-screen">
          {error ? (
            <>
              <p className="error-text">{error}</p>
              <button className="primary-btn" onClick={() => setScreen("hub")}>
                おへやにもどる
              </button>
            </>
          ) : (
            <>
              <div className="video-pair">
                <video src={mode === "self" ? beforeUrl : teacherUrl} controls playsInline />
                <video src={mode === "self" ? afterUrl : ownUrl} controls playsInline />
              </div>
              <div className="score-dial">{score}てん</div>
              <div className={`result-char ${burst ? "bounce" : ""}`}>
                <CharacterArt animal={animal} stageIdx={stageIdx} sizeMult={1.3} />
                {burst && (
                  <div className="sparkle-burst">
                    <span>✨</span>
                    <span>🍖</span>
                    <span>✨</span>
                  </div>
                )}
              </div>
              <p className="result-message">
                {awarded ? "🎉 おやつタイム！すごい成長だね！" : "また明日もチャレンジしよう！"}
              </p>
              <button className="cta-btn" onClick={() => setScreen("hub")}>
                おへやにもどる
              </button>
            </>
          )}
        </div>
      )}
    </div>
  );
}

:root{

  --coral:#FF8B67;
  --teal:#35B192;
  --sun:#FFC94A;
  --ink:#2C3B36;
  --card:#FFFFFF;
}
*{box-sizing:border-box;}
.app-root{
  min-height:100vh;width:100%;
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Rounded Mplus 1c","Hiragino Sans",sans-serif;
  background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bottom) 100%);
  color:var(--ink);display:flex;justify-content:center;padding:16px;
}
.app-root.loading{align-items:center;flex-direction:column;justify-content:center;gap:8px;}
.screen{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:12px;}
.title{font-size:1.5rem;font-weight:800;letter-spacing:.04em;margin:4px 0 0;}
.subtitle{font-size:.9rem;color:#5b6b64;margin-top:-6px;}

/* 部屋選択 */
.door-list{display:flex;flex-direction:column;gap:12px;width:100%;}
.door-card{
  border:none;border-radius:22px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:0 8px 18px rgba(0,0,0,.08);cursor:pointer;position:relative;
}
.door-emoji{font-size:2.6rem;}
.door-name{font-weight:800;}
.door-stage{font-size:.75rem;color:#5b6b64;}
.door-enter{margin-top:6px;font-weight:800;color:var(--coral);font-size:.85rem;}
.wander-mini{display:inline-block;animation:bob 1.6s ease-in-out infinite;}

/* ハブ（部屋） */
.hub-screen{gap:10px;}
.back-link{align-self:flex-start;background:none;border:none;font-weight:700;color:#5b6b64;cursor:pointer;padding:4px 0;}
.room-view{
  position:relative;width:100%;border-radius:24px;overflow:hidden;min-height:220px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.08);
}
.room-floor{position:absolute;bottom:0;left:0;right:0;height:26%;opacity:.6;}
.streak-badge{position:absolute;top:12px;left:14px;background:var(--card);border-radius:999px;padding:4px 10px;font-size:.75rem;font-weight:700;z-index:2;}
.mood-bubble{position:absolute;bottom:10px;left:10px;right:10px;background:rgba(255,255,255,.92);border-radius:14px;padding:8px 12px;font-size:.78rem;z-index:2;}
.deco-item{position:absolute;font-size:1.6rem;filter:drop-shadow(0 3px 3px rgba(0,0,0,.15));z-index:1;transform:translate(-50%,-50%);touch-action:none;}
.deco-item.draggable{cursor:grab;padding:6px;border-radius:12px;}
.deco-item.draggable:hover{background:rgba(255,255,255,.35);}
.deco-item.dragging{cursor:grabbing;background:rgba(255,255,255,.5);z-index:5;}
.edit-hint{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.9);border-radius:12px;padding:5px 10px;font-size:.7rem;font-weight:700;z-index:3;}
.layout-toggle-btn{width:100%;padding:10px;border:none;border-radius:14px;background:var(--card);font-weight:800;font-size:.85rem;box-shadow:0 3px 0 rgba(0,0,0,.06);cursor:pointer;}
.layout-toggle-btn.active{background:var(--sun);}

.room-char-wrap{position:relative;display:flex;flex-direction:column;align-items:center;z-index:1;}
.room-char-wrap.wander{animation:wander 6s ease-in-out infinite;}
.room-char-wrap.wander.slow{animation-duration:10s;}
.room-char-emoji{position:relative;line-height:1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.15));}
.mood-icon{position:absolute;top:-10px;right:-14px;font-size:1.2rem;}
.char-shadow{width:46%;height:10px;background:rgba(0,0,0,.15);border-radius:50%;margin-top:2px;}
@keyframes wander{
  0%{transform:translateX(-60px) scaleX(1);}
  23%{transform:translateX(50px) scaleX(1);}
  25%{transform:translateX(50px) scaleX(-1);}
  48%{transform:translateX(-60px) scaleX(-1);}
  50%{transform:translateX(-60px) scaleX(1);}
  100%{transform:translateX(-60px) scaleX(1);}
}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.bounce-loop{animation:bob 1.4s ease-in-out infinite;}

.stat-row{display:flex;gap:8px;width:100%;}
.stat-box{flex:1;background:var(--card);border-radius:14px;padding:8px 10px;box-shadow:0 3px 0 rgba(0,0,0,.05);}
.stat-label{font-size:.65rem;color:#8a9690;}
.stat-value{font-weight:800;font-size:.9rem;}
.health-bar{width:100%;height:10px;background:#eee;border-radius:999px;overflow:hidden;margin-top:4px;}
.health-fill{height:100%;transition:width .3s;}

.mode-toggle{display:flex;gap:8px;width:100%;}
.mode-btn{flex:1;padding:12px 6px;border-radius:16px;border:none;background:var(--card);font-weight:700;font-size:.85rem;box-shadow:0 3px 0 rgba(0,0,0,.06);cursor:pointer;}
.mode-btn.active{background:var(--teal);color:white;}

.cta-btn{width:100%;padding:16px;border:none;border-radius:20px;background:var(--coral);color:white;font-size:1.05rem;font-weight:800;box-shadow:0 6px 0 #d9694a;cursor:pointer;}
.cta-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #d9694a;}
.primary-btn{padding:14px 22px;border:none;border-radius:16px;background:var(--teal);color:white;font-weight:800;box-shadow:0 5px 0 #22836b;cursor:pointer;}
.ghost-btn{padding:14px 22px;border-radius:16px;background:transparent;border:2px solid #cfd8d4;color:var(--ink);font-weight:700;cursor:pointer;}
.btn-row{display:flex;gap:10px;width:100%;justify-content:center;}

.step-label{font-weight:800;font-size:1rem;}
.capture-wrap{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;}
.video-frame{position:relative;width:100%;aspect-ratio:3/4;background:#111;border-radius:24px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.video-frame video{width:100%;height:100%;object-fit:cover;}
.upload-frame{background:#f0efe9;}
.mirror-btn{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.85);border:none;border-radius:999px;width:38px;height:38px;font-size:1.1rem;cursor:pointer;}
.record-btn{padding:14px 28px;border-radius:999px;border:none;background:var(--coral);color:white;font-weight:800;font-size:1rem;box-shadow:0 5px 0 #d9694a;cursor:pointer;}
.record-btn.recording{background:#d94848;box-shadow:0 5px 0 #a53232;}
.cam-error{color:white;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;padding:0 16px;}
.cam-error-title{font-weight:800;font-size:.95rem;margin:0;}
.cam-error-detail{font-size:.75rem;opacity:.85;margin:0;}
.cam-warning{color:#a53232;font-weight:700;font-size:.8rem;text-align:center;}
.build-tag{align-self:flex-end;font-size:.6rem;color:#b7c2bd;}
.build-tag-top{font-size:.65rem;color:#8a9690;margin:0;font-weight:700;}
.upload-btn{background:var(--sun);color:var(--ink);padding:10px 18px;border-radius:14px;font-weight:800;cursor:pointer;}
.upload-btn.big{padding:22px 26px;font-size:1rem;}
.upload-btn-wrap{position:relative;display:inline-block;border-radius:14px;overflow:hidden;background:var(--sun);}
.upload-btn-wrap.big .upload-btn-label{padding:22px 26px;font-size:1rem;}
.upload-btn-label{display:block;padding:10px 18px;font-weight:800;color:var(--ink);pointer-events:none;text-align:center;}
.upload-input-overlay{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0;}

.timer-screen{align-items:center;text-align:center;padding-top:20px;}
.speech-bubble{background:var(--card);border-radius:16px;padding:8px 16px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.06);}
.timer-count{font-size:2.4rem;font-weight:800;letter-spacing:.05em;}
.timer-caption{font-size:.85rem;color:#5b6b64;}

.center-screen{align-items:center;justify-content:center;min-height:50vh;}

.result-screen{align-items:center;}
.video-pair{display:flex;gap:8px;width:100%;}
.video-pair video{flex:1;width:0;border-radius:16px;background:#111;aspect-ratio:3/4;object-fit:cover;}
.score-dial{font-size:2rem;font-weight:900;color:var(--coral);}
.result-char{position:relative;}
.result-char.bounce{animation:pop .5s ease;}
@keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.3);}100%{transform:scale(1);}}
.sparkle-burst{position:absolute;top:-10px;right:-30px;display:flex;gap:4px;font-size:1.3rem;animation:rise 1.8s ease forwards;}
@keyframes rise{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(-40px);opacity:0;}}
.result-message{font-weight:800;font-size:1rem;}
.error-text{font-weight:700;color:#a53232;}

/* カレンダー */
.calendar-card{width:100%;background:var(--card);border-radius:20px;padding:14px;box-shadow:0 4px 0 rgba(0,0,0,.05);}
.cal-title{font-weight:800;font-size:.9rem;margin-bottom:8px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-head{margin-bottom:4px;}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font-size:.7rem;position:relative;}
.cal-cell.head{font-weight:800;color:#8a9690;background:none;}
.cal-cell.empty{background:none;}
.cal-cell.done{background:#FFF3D2;}
.cal-cell.today{outline:2px solid var(--coral);}
.cal-day-num{font-size:.65rem;color:#5b6b64;}
.cal-stamp{font-size:.85rem;margin-top:-2px;}
.cal-legend{margin-top:6px;font-size:.68rem;color:#8a9690;}

/* ショップ */
.shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.shop-item{border:none;background:#F7F5EF;border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.05);}
.shop-item:disabled{cursor:default;}
.shop-item.owned{background:#E4F5EC;}
.shop-emoji{font-size:1.5rem;}
.shop-name{font-size:.72rem;font-weight:700;}
.shop-cost{font-size:.66rem;color:#8a9690;}

@media (orientation:landscape){
  .app-root{padding:10px;}
  .screen{max-width:860px;}
  .capture-wrap{flex-direction:row;flex-wrap:wrap;justify-content:center;}
  .video-frame{aspect-ratio:16/9;max-width:520px;}
  .video-pair{flex-direction:row;}
  .video-pair video{aspect-ratio:16/9;}
  .door-list{flex-direction:row;}
  .door-card{flex:1;}
}
`;

clearTimeout(window.__bootTimeout);
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<DanceGrowApp />);
</script>
</body>
</html>
