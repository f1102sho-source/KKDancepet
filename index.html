/* このファイルを外部ホスティングで開いたとき用の window.storage 代替。
   同期コードが設定されていてFirebaseが使える場合はクラウド(Firestore)に、
   それ以外はこれまで通りこの端末だけのlocalStorageに保存する。
   （Claudeのアーティファクト内であれば元々の window.storage をそのまま使う） */
if (!window.storage) {
  window.storage = {
    async get(key) {
      const code = getSyncCode();
      if (firestoreDb && code) {
        const doc = await firestoreDb.collection("dancePetSync").doc(code).get();
        if (!doc.exists || !(key in (doc.data() || {}))) throw new Error("not found");
        return { key, value: doc.data()[key] };
      }
      const v = localStorage.getItem(key);
      if (v === null) throw new Error("not found");
      return { key, value: v };
    },
    async set(key, value) {
      const code = getSyncCode();
      if (firestoreDb && code) {
        await firestoreDb
          .collection("dancePetSync")
          .doc(code)
          .set({ [key]: value, _updatedAt: Date.now() }, { merge: true });
        return { key, value };
      }
      localStorage.setItem(key, value);
      return { key, value };
    },
    async delete(key) {
      const code = getSyncCode();
      if (firestoreDb && code) {
        await firestoreDb
          .collection("dancePetSync")
          .doc(code)
          .set({ [key]: firebase.firestore.FieldValue.delete() }, { merge: true });
        return { key, deleted: true };
      }
      localStorage.removeItem(key);
      return { key, deleted: true };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix };
    },
  };
}

function todayStr(offset = 0) {
  const d = new Date();

}

function daysBetween(a, b) {

/* げんき度：最後に練習した日からの経過日数で決まる（保存しておく必要はない） */
function calcHealth(lastDate) {
  if (!lastDate) return 75;
  const diff = daysBetween(todayStr(), lastDate);
  if (diff <= 1) return 100;
  return Math.max(0, 100 - (diff - 1) * 22);
}

/* ============ 動画のモーション解析（簡易プロトタイプ版） ============ */
function seekTo(video, t, timeoutMs = 2500) {
  return new Promise((resolve) => {
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      video.removeEventListener("seeked", handler);
      resolve();
    };
    const handler = () => finish();
    video.addEventListener("seeked", handler);
    try {
      video.currentTime = t;
    } catch {
      finish();
      return;
    }
    setTimeout(finish, timeoutMs); // seekedが来ない場合でも先に進める
  });
}

/* Chromeなどでは MediaRecorder のブロブ動画の duration が Infinity になることがあり、
   そのままだとシークができない。大きな値へ一度シークして長さを確定させる対処。 */
function fixDuration(video) {
  return new Promise((resolve) => {
    if (video.duration && isFinite(video.duration) && video.duration > 0) {
      resolve();
      return;
    }
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      video.removeEventListener("timeupdate", onTimeUpdate);
      video.currentTime = 0;
      resolve();
    };
    const onTimeUpdate = () => finish();
    video.addEventListener("timeupdate", onTimeUpdate);
    try {
      video.currentTime = 1e7;
    } catch {
      finish();
      return;
    }
    setTimeout(finish, 2500);
  });
}

/* 既に読み込み済みの<video>要素からモーション曲線を取り出す。
   （新しくvideo要素を作って同じ動画を読み込み直すと、端末によって
   「対応していない形式」として弾かれることがあるため、それを避ける）
   あわせて「動きが始まったタイミング」も推定する（曲線の中で最初に
   一定以上のエネルギーになったサンプル位置＝動き出しとみなす）。 */
async function extractMotionCurveFromElement(video, samples = 24) {
  await fixDuration(video);
  let duration = video.duration;
  if (!duration || !isFinite(duration) || duration <= 0) duration = 3;
  const canvas = document.createElement("canvas");
  canvas.width = 48;
  canvas.height = 48;
  const ctx = canvas.getContext("2d");
  let prev = null;
  const energies = [];
  const sampleTimes = [];
  const originalTime = video.currentTime;
  for (let i = 0; i < samples; i++) {
    const t = (duration * i) / Math.max(samples - 1, 1);
    await seekTo(video, Math.min(t, Math.max(duration - 0.05, 0)));
    ctx.drawImage(video, 0, 0, 48, 48);
    const frame = ctx.getImageData(0, 0, 48, 48).data;
    if (prev) {
      let diff = 0;
      for (let p = 0; p < frame.length; p += 4) {
        diff +=
          Math.abs(frame[p] - prev[p]) +
          Math.abs(frame[p + 1] - prev[p + 1]) +
          Math.abs(frame[p + 2] - prev[p + 2]);
      }
      energies.push(diff);
      sampleTimes.push(t);
    }
    prev = frame;
  }
  try {
    video.currentTime = originalTime || 0;
  } catch {
    /* noop */
  }
  const max = Math.max(...energies, 1);
  const curve = energies.map((e) => e / max);

  // 動き出しタイミングの推定：
  // 「じっとしている状態(冒頭の平均エネルギー)」を基準にして、そこから
  // どれだけ動きが増えたかで判定する（固定のしきい値だと、動画ごとの
  // 明るさや揺れの差で始まりの位置がずれてしまうため）。
  const baselineCount = Math.max(2, Math.round(curve.length * 0.15));
  const baseline = curve.slice(0, baselineCount).reduce((a, b) => a + b, 0) / baselineCount;
  const threshold = baseline + (1 - baseline) * 0.22;
  let startIdx = curve.findIndex((v) => v >= threshold);
  if (startIdx === -1) startIdx = 0;
  const startTime = sampleTimes[startIdx] ?? 0;

  return { curve, startTime, duration };
}

function compareSelf(before, after) {
  const sum = (arr) => arr.reduce((a, b) => a + b, 0);
  const b = sum(before) || 0.001;
  const a = sum(after);
  const improvement = (a - b) / b;
  return Math.max(0, Math.min(100, Math.round(50 + improvement * 90)));
}

function compareToTeacher(mine, teacher) {
  const len = Math.min(mine.length, teacher.length);
  let dot = 0,
    magA = 0,
    magB = 0;
  for (let i = 0; i < len; i++) {
    dot += mine[i] * teacher[i];
    magA += mine[i] * mine[i];
    magB += teacher[i] * teacher[i];
  }
  const denom = Math.sqrt(magA) * Math.sqrt(magB) || 0.001;
  const sim = Math.max(0, Math.min(1, dot / denom));
  return Math.round(sim * 100);
}

function fluffRing(cx, cy, r, count, bumpR, color) {
  return Array.from({ length: count }).map((_, i) => {
    const angle = (i / count) * Math.PI * 2;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle) * 0.88;
    return <circle key={i} cx={x} cy={y} r={bumpR} fill={color} />;
  });
}

/* ============ 部屋のかざり（ドラッグで自由配置）・ショップ ============ */
function DraggableDeco({ item, pos, editable, onDragEnd }) {
  const elRef = useRef(null);

  const handlePointerDown = (e) => {
    if (!editable) return;
    e.preventDefault();
    const el = elRef.current;
    const roomEl = el.closest(".room-view");
    if (!roomEl) return;
    el.classList.add("dragging");
    const rect = roomEl.getBoundingClientRect();

    const move = (ev) => {
      const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
      let x = ((clientX - rect.left) / rect.width) * 100;
      let y = ((clientY - rect.top) / rect.height) * 100;
      x = Math.min(92, Math.max(4, x));
      y = Math.min(90, Math.max(6, y));
      el.style.left = `${x}%`;
      el.style.top = `${y}%`;
      el.dataset.x = x;
      el.dataset.y = y;
    };
    const up = () => {
      el.classList.remove("dragging");
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      const x = parseFloat(el.dataset.x ?? pos.x);
      const y = parseFloat(el.dataset.y ?? pos.y);
      onDragEnd(item.id, x, y);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  };

  return (
    <div
      ref={elRef}
      className={`deco-item ${editable ? "draggable" : ""}`}
      style={{ left: `${pos.x}%`, top: `${pos.y}%` }}
      onPointerDown={handlePointerDown}
    >
      {item.emoji}
    </div>
  );
}

/* ============ 反省ノート（音声吹き込み） ============ */
/* 簡易的な要約（サーバーに接続しないため、AIによる要約ではなく
   文の重複除去＋先頭数文の抜き出しによる簡易整理） */
function summarizeText(text, maxLen = 60) {
  const sentences = text
    .split(/(?<=[。！？])/)
    .map((s) => s.trim())
    .filter(Boolean);
  const dedup = [];
  for (const s of sentences) {
    if (dedup[dedup.length - 1] !== s) dedup.push(s);
  }
  let joined = dedup.join("");
  if (!joined) joined = text.trim();
  if (joined.length <= maxLen) return joined;
  let summary = dedup.slice(0, 2).join("");
  if (summary.length > maxLen) summary = summary.slice(0, maxLen) + "…";
  else if (dedup.length > 2) summary += "…";
  return summary;
}

function ReflectionRecorder({ onSaved, alreadyRecordedToday }) {
  const [supported, setSupported] = useState(true);
  const [listening, setListening] = useState(false);
  const [transcript, setTranscript] = useState("");
  const [saved, setSaved] = useState(false);
  const [elapsedSec, setElapsedSec] = useState(0);
  const recognitionRef = useRef(null);
  const finalTextRef = useRef("");
  const sessionFinalizedIdxRef = useRef(0);
  const shouldContinueRef = useRef(false);
  const maxTimerRef = useRef(null);
  const tickTimerRef = useRef(null);

  useEffect(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setSupported(false);
      return;
    }
    const rec = new SR();
    rec.lang = "ja-JP";
    // continuous=trueだと端末によってresultIndexの扱いが不安定で
    // 同じ内容が繰り返し積み上がることがあるため、あえて短いセッションを
    // 繋げていく方式にする（1セッション＝1つの発話のまとまり）。
    rec.continuous = false;
    rec.interimResults = true;
    rec.onresult = (e) => {
      let sessionInterim = "";
      for (let i = 0; i < e.results.length; i++) {
        const res = e.results[i];
        if (res.isFinal) {
          if (i >= sessionFinalizedIdxRef.current) {
            finalTextRef.current += res[0].transcript;
            sessionFinalizedIdxRef.current = i + 1;
          }
        } else {
          sessionInterim += res[0].transcript;
        }
      }
      setTranscript(finalTextRef.current + sessionInterim);
    };
    rec.onerror = (e) => {
      if (e.error === "no-speech" || e.error === "aborted") return; // 軽微なものは無視して継続
      shouldContinueRef.current = false;
      setListening(false);
    };
    rec.onend = () => {
      // 端末側が勝手に区切って止めてしまった場合は、続きから自動で再開する
      if (shouldContinueRef.current) {
        try {
          sessionFinalizedIdxRef.current = 0;
          rec.start();
          return;
        } catch {
          /* noop */
        }
      }
      setListening(false);
    };
    recognitionRef.current = rec;
    return () => {
      shouldContinueRef.current = false;
      try {
        rec.stop();
      } catch {
        /* noop */
      }
      if (maxTimerRef.current) clearTimeout(maxTimerRef.current);
      if (tickTimerRef.current) clearInterval(tickTimerRef.current);
    };
  }, []);

  const startListening = () => {
    setSaved(false);
    setTranscript("");
    finalTextRef.current = "";
    sessionFinalizedIdxRef.current = 0;
    setElapsedSec(0);
    shouldContinueRef.current = true;
    try {
      recognitionRef.current?.start();
      setListening(true);
    } catch {
      /* すでに開始している場合は無視 */
    }
    if (maxTimerRef.current) clearTimeout(maxTimerRef.current);
    maxTimerRef.current = setTimeout(() => stopListening(), 60000); // 最長1分
    if (tickTimerRef.current) clearInterval(tickTimerRef.current);
    tickTimerRef.current = setInterval(() => setElapsedSec((s) => s + 1), 1000);
  };

  const stopListening = () => {
    shouldContinueRef.current = false;
    try {
      recognitionRef.current?.stop();
    } catch {
      /* noop */
    }
    setListening(false);
    if (maxTimerRef.current) {
      clearTimeout(maxTimerRef.current);
      maxTimerRef.current = null;
    }
    if (tickTimerRef.current) {
      clearInterval(tickTimerRef.current);
      tickTimerRef.current = null;
    }
  };

  const handleSave = () => {
    if (!transcript.trim()) return;
    onSaved(transcript.trim());
    setSaved(true);
  };

  const remaining = Math.max(0, 60 - elapsedSec);

  return (
    <div className="reflection-card">
      <div className="cal-title">🎤 反省ノート{alreadyRecordedToday ? "（今日のポイントはきろくずみ・追加はOK ✓）" : "（+2pt）"}</div>
      {!supported && (
        <>
          <p className="cal-legend">この端末では音声にんしきが使えないので、キーボードで入力してね。</p>
          <textarea
            className="reflection-textarea"
            value={transcript}
            onChange={(e) => {
              setTranscript(e.target.value);
              setSaved(false);
            }}
            placeholder="きょうの反省を入力してね..."
          />
        </>
      )}
      {supported && (
        <>
          <button className={`mic-btn ${listening ? "listening" : ""}`} onClick={listening ? stopListening : startListening}>
            {listening ? `🔴 きろく中...（のこり${remaining}びょう／タップでとめる）` : "🎤 タップして話す"}
          </button>
          {transcript && (
            <textarea
              className="reflection-textarea"
              value={transcript}
              onChange={(e) => {
                setTranscript(e.target.value);
                setSaved(false);
              }}
            />
          )}
        </>
      )}
      {transcript.trim() && (
        <button className="primary-btn" onClick={handleSave} disabled={saved}>
          {saved ? "ほぞんしたよ ✓" : "この内容でほぞんする"}
        </button>
      )}
    </div>
  );
}

/* ============ カレンダー ============ */
function PracticeCalendar({ practiceLog, reflections = {}, animalKey }) {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startWeekday = firstDay.getDay();
  const logSet = useMemo(() => new Set(practiceLog), [practiceLog]);
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const monthLabel = `${year}年${month + 1}月`;
  const todayDate = now.getDate();
  const [selectedDate, setSelectedDate] = useState(null);

  return (
    <div className="calendar-card">
      <div className="cal-title">📅 {monthLabel}のれんしゅうきろく</div>
      <div className="cal-grid cal-head">
        {["日", "月", "火", "水", "木", "金", "土"].map((w) => (
          <div key={w} className="cal-cell head">
            {w}
          </div>
        ))}
      </div>
      <div className="cal-grid">
        {cells.map((d, i) => {
          if (d === null) return <div key={i} className="cal-cell empty" />;
          const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
          const done = logSet.has(dateStr);
          const isToday = d === todayDate;
          const dayEntries = reflections[dateStr];
          const hasReflection = Array.isArray(dayEntries) ? dayEntries.length > 0 : !!dayEntries;
          return (
            <button
              key={i}
              className={`cal-cell cal-cell-btn ${done ? "done" : ""} ${isToday ? "today" : ""} ${selectedDate === dateStr ? "selected" : ""}`}
              onClick={() => setSelectedDate(selectedDate === dateStr ? null : dateStr)}
            >
              <span className="cal-day-num">{d}</span>
              {done && (
                <span className={`cal-stamp cal-stamp-${animalKey}`} aria-hidden="true">
                  🐾
                </span>
              )}
              {hasReflection && <span className="cal-note-dot">📝</span>}
            </button>
          );
        })}
      </div>
      <div className="cal-legend">🐾 = 練習した日　📝 = 反省ノートあり（日付をタップで確認）</div>
      {selectedDate &&
        (() => {
          const raw = reflections[selectedDate];
          const entries = Array.isArray(raw) ? raw : raw ? [typeof raw === "string" ? { full: raw, summary: raw } : raw] : [];
          return (
            <div className="cal-reflection-view">
              <div className="cal-reflection-date">{selectedDate}のはんせい（{entries.length}けん）</div>
              {entries.length === 0 && <div className="cal-reflection-text">この日はまだ反省ノートがないよ。</div>}
              {entries.map((entry, idx) => (
                <div key={idx} className="cal-reflection-entry">
                  <div className="cal-reflection-text">
                    {entries.length > 1 ? `${idx + 1}回目： ` : ""}
                    {entry.summary}
                  </div>
                  {entry.full !== entry.summary && (
                    <details className="cal-reflection-full">
                      <summary>ぜんぶ見る</summary>
                      <div className="cal-reflection-text">{entry.full}</div>
                    </details>
                  )}
                </div>
              ))}
            </div>
          );
        })()}
    </div>
  );
}

/* ============ カメラ撮影コンポーネント ============ */
function CameraRecorder({ label, mirrored, setMirrored, onCaptured }) {
  const videoRef = useRef(null);
  const previewVideoRef = useRef(null);
  const streamRef = useRef(null);
  const recorderRef = useRef(null);
  const chunksRef = useRef([]);
  const [recording, setRecording] = useState(false);
  const [camError, setCamError] = useState(null); // {title, detail}
  const [previewUrl, setPreviewUrl] = useState(null);
  const [confirming, setConfirming] = useState(false);
  const [confirmError, setConfirmError] = useState(null);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      if (!window.isSecureContext) {
        setCamError({
          title: "この画面はカメラを使えない設定だよ",
          detail: "アプリとして公開・保存してから開くとカメラが使えるようになるよ。今は下から動画をえらんでね。",
        });
        return;
      }
      if (!navigator.mediaDevices?.getUserMedia) {
        setCamError({
          title: "このブラウザはカメラに対応していないみたい",
          detail: "下から動画ファイルをえらんでね。",
        });
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 },
            aspectRatio: { ideal: 16 / 9 },
          },
          audio: false,
        });
        if (cancelled) {
          stream.getTracks().forEach((t) => t.stop());
          return;
        }
        streamRef.current = stream;
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          videoRef.current.play().catch(() => {});
        }
      } catch (e) {
        if (cancelled) return;
        if (e.name === "NotAllowedError" || e.name === "SecurityError") {
          setCamError({
            title: "カメラの使用が許可されていないよ",
            detail: "ブラウザの設定でこのアプリのカメラをオンにしてね。今は下から動画をえらべるよ。",
          });
        } else if (e.name === "NotFoundError") {
          setCamError({
            title: "カメラが見つからなかったよ",
            detail: "この端末にカメラがないか、他のアプリが使用中かも。下から動画をえらんでね。",
          });
        } else {
          setCamError({
            title: "カメラを使えなかったよ",
            detail: "今のこの画面（プレビュー）ではカメラがブロックされていることがあるよ。下から動画をえらんでね。",
          });
        }
      }
    })();
    return () => {
      cancelled = true;
      if (streamRef.current) streamRef.current.getTracks().forEach((t) => t.stop());
    };
  }, []);

  const [tooShortWarning, setTooShortWarning] = useState(false);

  const startRecording = () => {
    if (!streamRef.current) return;
    chunksRef.current = [];
    setTooShortWarning(false);
    // ブラウザが実際にサポートしている形式を優先的に選ぶ
    const preferredTypes = [
      "video/webm;codecs=vp8,opus",
      "video/webm;codecs=vp9,opus",
      "video/webm",
      "video/mp4",
    ];
    const supportedType = preferredTypes.find((t) => window.MediaRecorder?.isTypeSupported?.(t));
    const rec = supportedType ? new MediaRecorder(streamRef.current, { mimeType: supportedType }) : new MediaRecorder(streamRef.current);
    rec.ondataavailable = (e) => {
      if (e.data.size > 0) chunksRef.current.push(e.data);
    };
    rec.onstop = () => {
      // 実際に録画で使われた形式（rec.mimeType）をそのままラベルにする。
      // ここが実際の符号化形式とズレていると、再読み込み時に「対応していない形式」として弾かれることがある。
      const actualType = rec.mimeType || supportedType || "video/webm";
      const blob = new Blob(chunksRef.current, { type: actualType });
      if (blob.size < 8000) {
        // 短すぎる/データが空の録画は解析に失敗しやすいので、撮り直しを促す
        setTooShortWarning(true);
        return;
      }
      const url = URL.createObjectURL(blob);
      setPreviewUrl(url);
    };
    rec.start();
    recorderRef.current = rec;
    setRecording(true);
  };

  const stopRecording = () => {
    recorderRef.current?.stop();
    setRecording(false);
  };

  const handleFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    setPreviewUrl(url);
  };

  return (
    <div className="capture-wrap">
      <div className="step-label">{label}</div>
      <div className="video-frame">
        {!previewUrl && !camError && (
          <>
            <video
              ref={videoRef}
              autoPlay
              muted
              playsInline
              style={{ transform: mirrored ? "scaleX(-1)" : "none" }}
            />
            <div className="frame-guide" aria-hidden="true">
              <div className="frame-guide-line v1" />
              <div className="frame-guide-line v2" />
              <div className="frame-guide-line h1" />
              <div className="frame-guide-line h2" />
            </div>
            <div className="frame-hint">まん中に立って、全身が入るようにしてね</div>
          </>
        )}
        {previewUrl && (
          <video
            ref={previewVideoRef}
            src={previewUrl}
            controls
            playsInline
            muted
            style={{ transform: mirrored ? "scaleX(-1)" : "none" }}
          />
        )}
        {camError && !previewUrl && (
          <div className="cam-error">
            <p className="cam-error-title">{camError.title}</p>
            <p className="cam-error-detail">{camError.detail}</p>
            <div className="upload-btn-wrap">
              <span className="upload-btn-label">動画をえらぶ</span>
              <input type="file" accept="video/*" onChange={handleFile} className="upload-input-overlay" />
            </div>
          </div>
        )}
        {!camError && (
          <button className="mirror-btn" onClick={() => setMirrored(!mirrored)} title="さかさま">
            🔄
          </button>
        )}
      </div>

      {!camError && !previewUrl && (
        <button className={`record-btn ${recording ? "recording" : ""}`} onClick={recording ? stopRecording : startRecording}>
          {recording ? "とめる ■" : "とる ●"}
        </button>
      )}
      {tooShortWarning && !previewUrl && (
        <p className="cam-warning">みじかすぎて上手くとれなかったよ。もう少し長め（2秒くらい）にとってみてね。</p>
      )}
      {confirmError && <p className="cam-warning">{confirmError}</p>}

      {previewUrl && (
        <div className="btn-row">
          <button
            className="ghost-btn"
            onClick={() => {
              setPreviewUrl(null);
              setConfirmError(null);
            }}
          >
            とりなおす
          </button>
          <button
            className="primary-btn"
            disabled={confirming}
            onClick={async () => {
              setConfirming(true);
              setConfirmError(null);
              try {
                const video = previewVideoRef.current;
                if (!video) throw new Error("動画の準備ができていません");
                const curve = await extractMotionCurveFromElement(video);
                onCaptured(previewUrl, curve);
              } catch (e) {
                setConfirming(false);
                setConfirmError("うまく読み取れなかったよ。もう一度「とりなおす」から撮ってみてね。");
              }
            }}
          >
            {confirming ? "かいせき中..." : "これでOK！"}
          </button>
        </div>
      )}
    </div>
  );
}

/* ============ メインアプリ ============ */
function DanceGrowApp() {
  const [loaded, setLoaded] = useState(false);
  const [animal, setAnimal] = useState(null); // null = 部屋選択画面
  const [progress, setProgress] = useState({ dog: 0, cat: 0, chick: 0 });
  const [streaks, setStreaks] = useState({ dog: 0, cat: 0, chick: 0 });
  const [lastDates, setLastDates] = useState({ dog: null, cat: null, chick: null });
  const [practiceLogs, setPracticeLogs] = useState({ dog: [], cat: [], chick: [] });
  const [roomPointsMap, setRoomPointsMap] = useState({ dog: 0, cat: 0, chick: 0 });
  const [decorations, setDecorations] = useState({ dog: [], cat: [], chick: [] });
  const [reflectionsMap, setReflectionsMap] = useState({ dog: {}, cat: {}, chick: {} }); // {animal: {date: [entries]}}
  const [petNames, setPetNames] = useState({ dog: null, cat: null, chick: null });
  const [dirtiness, setDirtiness] = useState({ dog: 0, cat: 0, chick: 0 });
  const [restoredAug13, setRestoredAug13] = useState(false);
  const [lastDirtCheck, setLastDirtCheck] = useState({ dog: null, cat: null, chick: null });
  const leftVideoRef = useRef(null);
  const rightVideoRef = useRef(null);
  const [leftAspect, setLeftAspect] = useState(null);
  const [rightAspect, setRightAspect] = useState(null);

  const [screen, setScreen] = useState("roomSelect");
  const [mode, setMode] = useState("self");
  const [mirrored, setMirrored] = useState(true);
  const [editMode, setEditMode] = useState(false);

  const [beforeUrl, setBeforeUrl] = useState(null);
  const [afterUrl, setAfterUrl] = useState(null);
  const [teacherUrl, setTeacherUrl] = useState(null);
  const [ownUrl, setOwnUrl] = useState(null);
  const [beforeCurve, setBeforeCurve] = useState(null);
  const [afterCurve, setAfterCurve] = useState(null);
  const [teacherCurve, setTeacherCurve] = useState(null);
  const [ownCurve, setOwnCurve] = useState(null);
  const teacherVideoRef = useRef(null);
  const [teacherConfirming, setTeacherConfirming] = useState(false);
  const [teacherConfirmError, setTeacherConfirmError] = useState(null);

  const [elapsed, setElapsed] = useState(0);
  const [cheer, setCheer] = useState(CHEERS[0]);
  const [score, setScore] = useState(null);
  const [awarded, setAwarded] = useState(false);
  const [praiseMessage, setPraiseMessage] = useState("");
  const [burst, setBurst] = useState(false);
  const [error, setError] = useState(null);

  const [syncCode, setSyncCode] = useState("");
  const [syncStatus, setSyncStatus] = useState(null);

  const reloadAllData = useCallback(async () => {
    setLoaded(false);
    try {
      const res = await window.storage.get(STORAGE_KEY, false);
      if (res?.value) {
        const s = JSON.parse(res.value);
        setProgress(s.progress || { dog: 0, cat: 0, chick: 0 });
        setStreaks(s.streaks || { dog: 0, cat: 0, chick: 0 });
        setLastDates(s.lastDates || { dog: null, cat: null, chick: null });
        setPracticeLogs(s.practiceLogs || { dog: [], cat: [], chick: [] });
        setRoomPointsMap(s.roomPointsMap || { dog: 0, cat: 0, chick: 0 });
        setDecorations(s.decorations || { dog: [], cat: [], chick: [] });
        setReflectionsMap(s.reflectionsMap || { dog: {}, cat: {}, chick: {} });
        setPetNames(s.petNames || { dog: null, cat: null, chick: null });
        setDirtiness(s.dirtiness || { dog: 0, cat: 0, chick: 0 });
        setLastDirtCheck(s.lastDirtCheck || { dog: null, cat: null, chick: null });
        setRestoredAug13(!!s.restoredAug13);
      } else {
        // 同期コードを切り替えた先にまだデータがない場合は空の状態にする
        setProgress({ dog: 0, cat: 0, chick: 0 });
        setStreaks({ dog: 0, cat: 0, chick: 0 });
        setLastDates({ dog: null, cat: null, chick: null });
        setPracticeLogs({ dog: [], cat: [], chick: [] });
        setRoomPointsMap({ dog: 0, cat: 0, chick: 0 });
        setDecorations({ dog: [], cat: [], chick: [] });
        setReflectionsMap({ dog: {}, cat: {}, chick: {} });
        setPetNames({ dog: null, cat: null, chick: null });
        setDirtiness({ dog: 0, cat: 0, chick: 0 });
        setLastDirtCheck({ dog: null, cat: null, chick: null });
        setRestoredAug13(false);
      }
    } catch {
      // 初回は何もない（エラーでも空の状態のまま進める）
    } finally {
      setLoaded(true);
    }
  }, []);

  useEffect(() => {
    setSyncCode(getSyncCode());
    reloadAllData();
  }, [reloadAllData]);

  const applySyncCode = async (code) => {
    setSyncCodeLocal(code);
    setSyncCode(code);
    setSyncStatus(firebaseReady ? "どうきちゅう..." : "（クラウド設定が未設定のため、この端末だけの保存のままです）");
    await reloadAllData();
    setSyncStatus(firebaseReady ? "どうき完了！このコードを他の端末にも入力してね" : null);
  };

  const persist = useCallback(
    async (next) => {
      try {
        await window.storage.set(
          STORAGE_KEY,
          JSON.stringify({
            progress: next.progress ?? progress,
            streaks: next.streaks ?? streaks,
            lastDates: next.lastDates ?? lastDates,
            practiceLogs: next.practiceLogs ?? practiceLogs,
            roomPointsMap: next.roomPointsMap ?? roomPointsMap,
            decorations: next.decorations ?? decorations,
            reflectionsMap: next.reflectionsMap ?? reflectionsMap,
            petNames: next.petNames ?? petNames,
            dirtiness: next.dirtiness ?? dirtiness,
            lastDirtCheck: next.lastDirtCheck ?? lastDirtCheck,
            restoredAug13: next.restoredAug13 ?? restoredAug13,
          }),
          false
        );
      } catch {
        // 保存に失敗しても遊べる
      }
    },
    [progress, streaks, lastDates, practiceLogs, roomPointsMap, decorations, reflectionsMap, petNames, dirtiness, lastDirtCheck, restoredAug13]
  );

  useEffect(() => {
    if (screen !== "timer") return;
    const t1 = setInterval(() => setElapsed((e) => e + 1), 1000);
    const t2 = setInterval(() => setCheer(CHEERS[Math.floor(Math.random() * CHEERS.length)]), 3500);
    return () => {
      clearInterval(t1);
      clearInterval(t2);
    };
  }, [screen]);

  const enterRoom = (a) => {
    setAnimal(a);
    setScreen("hub");
  };

  const buyItem = (itemId) => {
    const item = ROOM_ITEMS.find((i) => i.id === itemId);
    if (!item || !animal) return;
    const ownedIds = decorations[animal].map((d) => d.id);
    const currentPoints = roomPointsMap[animal];
    if (ownedIds.includes(itemId) || currentPoints < item.cost) return;
    const count = decorations[animal].length;
    const x = 15 + (count % 4) * 20;
    const y = 22 + Math.floor(count / 4) * 24;
    const newDecorations = { ...decorations, [animal]: [...decorations[animal], { id: itemId, x, y }] };
    const newRoomPointsMap = { ...roomPointsMap, [animal]: currentPoints - item.cost };
    setDecorations(newDecorations);
    setRoomPointsMap(newRoomPointsMap);
    persist({ decorations: newDecorations, roomPointsMap: newRoomPointsMap });
  };

  const moveItem = (itemId, x, y) => {
    if (!animal) return;
    const newList = decorations[animal].map((d) => (d.id === itemId ? { ...d, x, y } : d));
    const newDecorations = { ...decorations, [animal]: newList };
    setDecorations(newDecorations);
    persist({ decorations: newDecorations });
  };

  const saveReflection = (text) => {
    if (!animal) return;
    const today = todayStr();
    const animalReflections = reflectionsMap[animal] || {};
    const dayEntries = animalReflections[today] || [];
    const isFirstToday = dayEntries.length === 0;
    const entry = { time: new Date().toISOString(), full: text, summary: summarizeText(text) };
    const newAnimalReflections = { ...animalReflections, [today]: [...dayEntries, entry] };
    const newReflectionsMap = { ...reflectionsMap, [animal]: newAnimalReflections };
    const newRoomPointsMap = isFirstToday ? { ...roomPointsMap, [animal]: roomPointsMap[animal] + 2 } : roomPointsMap;
    setReflectionsMap(newReflectionsMap);
    if (isFirstToday) setRoomPointsMap(newRoomPointsMap);
    persist({ reflectionsMap: newReflectionsMap, roomPointsMap: newRoomPointsMap });
  };

  const setPetName = (name) => {
    if (!animal) return;
    const newNames = { ...petNames, [animal]: name };
    setPetNames(newNames);
    persist({ petNames: newNames });
  };

  const DIRT_THRESHOLD_HEALTH = 35; // ふきげん(😾)以下になるとうんちが出る
  const MAX_DIRT = 5;

  // げんき度が低いまま1日経つと、うんちが1つ増える（1日1回だけ判定）
  useEffect(() => {
    if (!loaded || !animal) return;
    const today = todayStr();
    if (lastDirtCheck[animal] === today) return;
    const h = calcHealth(lastDates[animal]);
    if (h < DIRT_THRESHOLD_HEALTH) {
      const newDirtiness = { ...dirtiness, [animal]: Math.min(MAX_DIRT, dirtiness[animal] + 1) };
      const newLastDirtCheck = { ...lastDirtCheck, [animal]: today };
      setDirtiness(newDirtiness);
      setLastDirtCheck(newLastDirtCheck);
      persist({ dirtiness: newDirtiness, lastDirtCheck: newLastDirtCheck });
    } else {
      const newLastDirtCheck = { ...lastDirtCheck, [animal]: today };
      setLastDirtCheck(newLastDirtCheck);
      persist({ lastDirtCheck: newLastDirtCheck });
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded, animal]);

  const cleanRoom = () => {
    if (!animal) return;
    const CLEAN_COST = 2;
    if (dirtiness[animal] <= 0 || roomPointsMap[animal] < CLEAN_COST) return;
    const newDirtiness = { ...dirtiness, [animal]: 0 };
    const newRoomPointsMap = { ...roomPointsMap, [animal]: roomPointsMap[animal] - CLEAN_COST };
    setDirtiness(newDirtiness);
    setRoomPointsMap(newRoomPointsMap);
    persist({ dirtiness: newDirtiness, roomPointsMap: newRoomPointsMap });
  };

  // 2026-08-13にクラウド同期の設定作業中にデータが消えてしまった分を、
  // 3部屋ぶんまとめて一度だけ復元するための特別対応（一度使うと消える）
  const restoreAug13Record = () => {
    const targetDate = "2026-08-13";
    const animals = ["dog", "cat", "chick"];
    const newPracticeLogs = { ...practiceLogs };
    const newRoomPointsMap = { ...roomPointsMap };
    const newLastDates = { ...lastDates };
    const newStreaks = { ...streaks };
    animals.forEach((k) => {
      if (!newPracticeLogs[k].includes(targetDate)) {
        newPracticeLogs[k] = [...newPracticeLogs[k], targetDate].sort();
      }
      newRoomPointsMap[k] = (newRoomPointsMap[k] || 0) + 7;
      if (!newLastDates[k] || newLastDates[k] < targetDate) {
        newLastDates[k] = targetDate;
      }
      if (!newStreaks[k]) newStreaks[k] = 1;
    });
    setPracticeLogs(newPracticeLogs);
    setRoomPointsMap(newRoomPointsMap);
    setLastDates(newLastDates);
    setStreaks(newStreaks);
    setRestoredAug13(true);
    persist({
      practiceLogs: newPracticeLogs,
      roomPointsMap: newRoomPointsMap,
      lastDates: newLastDates,
      streaks: newStreaks,
      restoredAug13: true,
    });
  };

  const startFlow = (m) => {
    setMode(m);
    setBeforeUrl(null);
    setAfterUrl(null);
    setTeacherUrl(null);
    setOwnUrl(null);
    setBeforeCurve(null);
    setAfterCurve(null);
    setTeacherCurve(null);
    setOwnCurve(null);
    setScore(null);
    setAwarded(false);
    setBurst(false);
    setError(null);
    setElapsed(0);
    setLeftAspect(null);
    setRightAspect(null);
    setScreen(m === "self" ? "before" : "teacherUpload");
  };

  const runAnalysis = async (curves) => {
    setScreen("analyzing");
    try {
      let s;
      if (mode === "self") {
        s = compareSelf(curves.before.curve, curves.after.curve);
      } else {
        s = compareToTeacher(curves.own.curve, curves.teacher.curve);
      }
      setScore(s);
      const success = s >= 60;
      setAwarded(success);
      setPraiseMessage(buildPraise(animal, s));

      const today = todayStr();
      const prevStreak = streaks[animal];
      const prevLastDate = lastDates[animal];
      let newStreak = prevStreak;
      if (prevLastDate !== today) {
        newStreak = prevLastDate === todayStr(-1) ? prevStreak + 1 : 1;
      }
      const newProgress = { ...progress, [animal]: progress[animal] + (success ? 1 : 0) };
      const isNewDay = !practiceLogs[animal].includes(today);
      const newLog = isNewDay ? [...practiceLogs[animal], today].slice(-90) : practiceLogs[animal];
      const newRoomPointsMap = isNewDay ? { ...roomPointsMap, [animal]: roomPointsMap[animal] + 5 } : roomPointsMap;
      const newStreaks = { ...streaks, [animal]: newStreak };
      const newLastDates = { ...lastDates, [animal]: today };
      const newPracticeLogs = { ...practiceLogs, [animal]: newLog };

      setStreaks(newStreaks);
      setLastDates(newLastDates);
      setProgress(newProgress);
      setPracticeLogs(newPracticeLogs);
      setRoomPointsMap(newRoomPointsMap);
      persist({
        streaks: newStreaks,
        lastDates: newLastDates,
        progress: newProgress,
        practiceLogs: newPracticeLogs,
        roomPointsMap: newRoomPointsMap,
      });

      setScreen("result");
      if (success) {
        setTimeout(() => setBurst(true), 300);
        setTimeout(() => setBurst(false), 2200);
      }
    } catch (e) {
      setError("うまく比べられなかったよ。もう一度ためしてね。（" + (e?.message || "不明なエラー") + "）");
      setScreen("result");
    }
  };

  if (!loaded) {
    return (
      <div className="app-root loading">
        <style>{GLOBAL_CSS}</style>
        <div style={{ fontSize: "3rem" }}>🐾</div>
        <p>よみこみ中...</p>
      </div>
    );
  }

  const health = animal ? calcHealth(lastDates[animal]) : 75;
  const tier = animal ? healthTier(health) : null;
  const a = animal ? ANIMALS[animal] : null;
  const stageIdx = animal ? (animal === "chick" ? Math.min(getStageIndex(progress[animal]), 3) : getStageIndex(progress[animal])) : 0;

  return (
    <div className="app-root">
      <style>{GLOBAL_CSS}</style>

      {screen === "roomSelect" && (
        <div className="screen room-select-screen">
          <h1 className="title">コツコツダンスペット</h1>
          <p className="build-tag-top">build 2026-08-14-c</p>
          <p className="subtitle">どのおへやに入る？</p>
          <div className="door-list">
            {Object.keys(ANIMALS).map((k) => {
              const stIdx = Math.min(getStageIndex(progress[k]), 3);
              const st = STAGE_META[stIdx];
              return (
                <button key={k} className="door-card" style={{ background: ANIMALS[k].roomBg }} onClick={() => enterRoom(k)}>
                  <div className="door-emoji wander-mini">
                    <CharacterArt animal={k} stageIdx={stIdx} sizeMult={1} />
                  </div>
                  <div className="door-name">{petNames[k] ? `${petNames[k]}のへや` : `${ANIMALS[k].name}のへや`}</div>
                  <div className="door-stage">{st.label}</div>
                  <div className="door-enter">入る ▶</div>
                </button>
              );
            })}
          </div>
          <SyncSettings currentCode={syncCode} onApply={applySyncCode} status={syncStatus} firebaseReady={firebaseReady} />
          {!restoredAug13 && (
            <button className="restore-btn" onClick={restoreAug13Record}>
              🛠️ 8/13の記録（足あと＋7pt×3部屋）をもどす
            </button>
          )}
        </div>
      )}

      {screen === "hub" && animal && (
        <div className="screen hub-screen">
          <button className="back-link" onClick={() => setScreen("roomSelect")}>
            ◀ おへやをかえる
          </button>
          <div className="build-tag">build 2026-08-14-c</div>

          <div className="room-view" style={{ background: a.roomBg }}>
            <div className="room-floor" style={{ background: a.floor }} />
            <RoomDecorations owned={decorations[animal]} editable={editMode} onDragEnd={moveItem} />
            <RoomMess count={dirtiness[animal]} />
            {streaks[animal] > 0 && <div className="streak-badge">🔥 {streaks[animal]}日れんぞく</div>}
            <RoomCharacter animal={animal} totalSnacks={progress[animal]} health={health} size={1.3} wander={!editMode} />
            {tier.msg && !editMode && (
              <div className="mood-bubble">
                <strong>{tier.label}</strong>
                <div>{tier.msg}</div>
              </div>
            )}
            {editMode && <div className="edit-hint">かぐをドラッグして動かせるよ ✋</div>}
          </div>

          {dirtiness[animal] > 0 && (
            <button className="clean-btn" disabled={roomPointsMap[animal] < 2} onClick={cleanRoom}>
              🧹 おそうじする（-2pt）{roomPointsMap[animal] < 2 ? "（ポイントが足りないよ）" : ""}
            </button>
          )}

          <button className={`layout-toggle-btn ${editMode ? "active" : ""}`} onClick={() => setEditMode(!editMode)}>
            {editMode ? "✅ レイアウトかんりょう" : "🖐️ 部屋をととのえる"}
          </button>

          <div className="stat-row">
            <div className="stat-box">
              <div className="stat-label">なまえ</div>
              <div className="stat-value">{petNames[animal] ? petNames[animal] : a.name}</div>
              {petNames[animal] && <div className="stat-sublabel">{a.name}</div>}
            </div>
            <div className="stat-box">
              <div className="stat-label">せいちょう</div>
              <div className="stat-value">{STAGE_META[stageIdx].label}</div>
            </div>
            <div className="stat-box">
              <div className="stat-label">げんき度</div>
              <div className="health-bar">
                <div className="health-fill" style={{ width: `${health}%`, background: health >= 65 ? "#35B192" : health >= 35 ? "#FFC94A" : "#E05555" }} />
              </div>
            </div>
          </div>

          {stageIdx >= 1 && !petNames[animal] && <PetNamer onNameSet={setPetName} />}

          <div className="mode-toggle">
            <button className={`mode-btn ${mode === "self" ? "active" : ""}`} onClick={() => setMode("self")}>
              📹 自分と比べる
            </button>
            <button className={`mode-btn ${mode === "teacher" ? "active" : ""}`} onClick={() => setMode("teacher")}>
              👩‍🏫 先生と比べる
            </button>
          </div>

          <button className="cta-btn" onClick={() => startFlow(mode)}>
            今日の練習をはじめる ▶
          </button>

          <PracticeCalendar practiceLog={practiceLogs[animal]} reflections={reflectionsMap[animal]} animalKey={animal} />
          <RoomShop roomPoints={roomPointsMap[animal]} owned={decorations[animal]} onBuy={buyItem} />
        </div>
      )}

      {screen === "before" && (
        <div className="screen">
          <CameraRecorder
            label="① 練習まえのダンスをとろう"
            mirrored={mirrored}
            setMirrored={setMirrored}
            onCaptured={(url, curve) => {
              setBeforeUrl(url);
              setBeforeCurve(curve);
              setScreen("timer");
            }}
          />
        </div>
      )}

      {screen === "teacherUpload" && (
        <div className="screen">
          <div className="capture-wrap">
            <div className="step-label">① 先生のお手本動画を入れよう</div>
            <div className="video-frame upload-frame">
              {teacherUrl ? (
                <video ref={teacherVideoRef} src={teacherUrl} controls muted playsInline />
              ) : (
                <div className="upload-btn-wrap big">
                  <span className="upload-btn-label">先生の動画をえらぶ 🎥</span>
                  <input
                    type="file"
                    accept="video/*"
                    className="upload-input-overlay"
                    onChange={(e) => {
                      const f = e.target.files?.[0];
                      if (f) {
                        setTeacherUrl(URL.createObjectURL(f));
                        setTeacherConfirmError(null);
                      }
                    }}
                  />
                </div>
              )}
            </div>
            {teacherConfirmError && <p className="cam-warning">{teacherConfirmError}</p>}
            {teacherUrl && (
              <button
                className="primary-btn"
                disabled={teacherConfirming}
                onClick={async () => {
                  setTeacherConfirming(true);
                  setTeacherConfirmError(null);
                  try {
                    const video = teacherVideoRef.current;
                    if (!video) throw new Error("動画の準備ができていません");
                    const curve = await extractMotionCurveFromElement(video);
                    setTeacherCurve(curve);
                    setScreen("timer");
                  } catch (e) {
                    setTeacherConfirmError("うまく読み取れなかったよ。別の動画を選ぶか、もう一度試してね。");
                  } finally {
                    setTeacherConfirming(false);
                  }
                }}
              >
                {teacherConfirming ? "かいせき中..." : "これでOK！"}
              </button>
            )}
          </div>
        </div>
      )}

      {screen === "timer" && (
        <div className="screen timer-screen">
          <div className="bounce-loop">
            {a ? <CharacterArt animal={animal} stageIdx={stageIdx} sizeMult={1.6} /> : "🐾"}
          </div>
          <div className="speech-bubble">{cheer}</div>
          <div className="timer-count">
            {String(Math.floor(elapsed / 60)).padStart(2, "0")}:{String(elapsed % 60).padStart(2, "0")}
          </div>
          <p className="timer-caption">
            {mode === "teacher" ? "先生の動画を見ながらいっしょに踊ってみよう！" : "すきなだけ練習してね！"}
          </p>
          <button className="cta-btn" onClick={() => setScreen(mode === "self" ? "after" : "own")}>
            れんしゅう終わり！ ▶
          </button>
        </div>
      )}

      {screen === "after" && (
        <div className="screen">
          <CameraRecorder
            label="② 練習あとのダンスをとろう"
            mirrored={mirrored}
            setMirrored={setMirrored}
            onCaptured={(url, curve) => {
              setAfterUrl(url);
              setAfterCurve(curve);
              runAnalysis({ before: beforeCurve, after: curve });
            }}
          />
        </div>
      )}

      {screen === "own" && (
        <div className="screen">
          <CameraRecorder
            label="② 自分のダンスをとろう"
            mirrored={mirrored}
            setMirrored={setMirrored}
            onCaptured={(url, curve) => {
              setOwnUrl(url);
              setOwnCurve(curve);
              runAnalysis({ teacher: teacherCurve, own: curve });
            }}
          />
        </div>
      )}

      {screen === "analyzing" && (
        <div className="screen center-screen">
          <div className="bounce-loop">
            {a ? <CharacterArt animal={animal} stageIdx={stageIdx} sizeMult={1.6} /> : "🐾"}
          </div>
          <p>くらべているよ...🔍</p>
        </div>
      )}

      {screen === "result" && (
        <div className="screen result-screen">
          {error ? (
            <>
              <p className="error-text">{error}</p>
              <button className="primary-btn" onClick={() => setScreen("hub")}>
                おへやにもどる
              </button>
            </>
          ) : (
            <>
              <div
                className={`video-pair ${
                  (leftAspect && leftAspect < 1) || (rightAspect && rightAspect < 1) ? "has-portrait" : "has-landscape"
                }`}
              >
                <div className="video-pair-item">
                  <div className="video-pair-label">{mode === "self" ? "れんしゅうまえ" : "せんせいのお手本"}</div>
                  <video
                    ref={leftVideoRef}
                    src={mode === "self" ? beforeUrl : teacherUrl}
                    controls
                    playsInline
                    muted
                    style={leftAspect ? { aspectRatio: leftAspect } : undefined}
                    onLoadedMetadata={(e) => {
                      const v = e.target;
                      if (v.videoWidth && v.videoHeight) setLeftAspect(v.videoWidth / v.videoHeight);
                    }}
                  />
                </div>
                <div className="video-pair-item">
                  <div className="video-pair-label">{mode === "self" ? "れんしゅうあと" : "じぶんのダンス"}</div>
                  <video
                    ref={rightVideoRef}
                    src={mode === "self" ? afterUrl : ownUrl}
                    controls
                    playsInline
                    muted
                    style={rightAspect ? { aspectRatio: rightAspect } : undefined}
                    onLoadedMetadata={(e) => {
                      const v = e.target;
                      if (v.videoWidth && v.videoHeight) setRightAspect(v.videoWidth / v.videoHeight);
                    }}
                  />
                </div>
              </div>
              <button
                className="sync-play-btn"
                onClick={() => {
                  const lv = leftVideoRef.current;
                  const rv = rightVideoRef.current;
                  const leftCurves = mode === "self" ? beforeCurve : teacherCurve;
                  const rightCurves = mode === "self" ? afterCurve : ownCurve;
                  if (!lv || !rv) return;
                  try {
                    lv.currentTime = leftCurves?.startTime || 0;
                    rv.currentTime = rightCurves?.startTime || 0;
                  } catch {
                    /* noop */
                  }
                  lv.play();
                  rv.play();
                }}
              >
                ▶ 動き出しから同時にさいせい
              </button>
              <div className="score-dial">{score}てん</div>
              <div className={`result-char ${burst ? "bounce" : ""}`}>
                <CharacterArt animal={animal} stageIdx={stageIdx} sizeMult={1.3} />
                {burst && (
                  <div className="sparkle-burst">
                    <span>✨</span>
                    <span>🍖</span>
                    <span>✨</span>
                  </div>
                )}
              </div>
              {praiseMessage && <div className="speech-bubble praise-bubble">{praiseMessage}</div>}
              <p className="result-message">
                {awarded ? "🎉 おやつタイム！すごい成長だね！" : "また明日もチャレンジしよう！"}
              </p>
              <ReflectionRecorder
                onSaved={(text) => saveReflection(text)}
                alreadyRecordedToday={!!(reflectionsMap[animal]?.[todayStr()]?.length > 0)}
              />
              <button className="cta-btn" onClick={() => setScreen("hub")}>
                おへやにもどる
              </button>
            </>
          )}
        </div>
      )}
    </div>
  );
}
